        setupUI() {
            // 设置标题
            const titleEl = document.getElementById('wiki-title-display');
            const subtitleEl = document.getElementById('wiki-subtitle-display');
            if (titleEl) titleEl.textContent = this.data.settings.name || '未命名 Wiki';
            if (subtitleEl) {
                if (this.data.settings.subtitle) {
                    subtitleEl.textContent = this.data.settings.subtitle;
                    subtitleEl.classList.remove('hidden');
                } else {
                    subtitleEl.classList.add('hidden');
                }
            }
            // 设置时间轴选择器【修复】先清空已有选项，避免重复累积
            const selector = document.getElementById('timeline-selector');
            if (selector) {
                selector.innerHTML = '';
                if (this.data.chapters && this.data.chapters.length > 0) {
                    // 【修复】重新添加"最新进度"选项，避免被清空后丢失
                    const latestOpt = document.createElement('option');
                    latestOpt.value = 'latest';
                    latestOpt.textContent = '最新进度 (全部内容)';
                    selector.appendChild(latestOpt);
                    const sortedChapters = [...this.data.chapters].sort((a, b) => a.order - b.order);
                    sortedChapters.forEach(ch => {
                        const opt = document.createElement('option');
                        opt.value = ch.id;
                        opt.textContent = `${this.formatChapterNum(ch.num)} ${ch.title || ''}`;
                        selector.appendChild(opt);
                    });
                    document.getElementById('timeline-bar').classList.remove('hidden');
                }
            }
        },

        // ==================== 路由 ====================
        router(view, skipHistory = false) {
            // 【关键修复】离开首页时停止活动窗口自动轮播
            if (view !== 'home' && this._stopHomeBannerAutoPlay) this._stopHomeBannerAutoPlay();
            this.data.currentView = view;
            const container = document.getElementById('main-container');
            // 【修复】防御性检查：确保 container 存在
            if (!container) {
                console.error('[Router] main-container 不存在，延迟重试');
                setTimeout(() => this.router(view, skipHistory), 100);
                return;
            }
            container.innerHTML = '';

            // 【功能4】离开详情页时清除隐藏词条黑底白字状态
            if (view !== 'detail') {
                this.data._currentHiddenEntryId = null;
                container.classList.remove('hidden-entry-detail');
            }

            // 更新底部导航高亮
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const target = btn.dataset.target;
                if (target === view || (view === 'detail' && target === 'characters') || (view === 'non-characters' && target === 'non-characters') || (view === 'events' && target === 'events') || (view === 'about' && target === 'about')) {
                    btn.classList.add('text-indigo-600');
                    btn.classList.remove('text-gray-500');
                } else {
                    btn.classList.remove('text-indigo-600');
                    btn.classList.add('text-gray-500');
                }
            });

            // 关闭可能打开的tooltip
            this.closeSynopsisTooltip();

            // 【回到xx】回到首页/列表页时清空记录
            if (['home', 'characters', 'non-characters'].includes(view)) {
                this._clearPreviousEntry();
            }

            switch (view) {
                case 'home': this.renderHome(container); break;
                case 'characters': this.renderList(container, 'character'); break;
                case 'non-characters': this.renderSettingsGrouped(container); break;
                case 'events': this.renderEvents(container); break;
                case 'graph': this.renderGraph(container); break;
                case 'detail': this.renderDetail(container); break;
                case 'synopsis': this.renderSynopsisView(container); break;
                default: this.renderHome(container);
            }
        },

        // ==================== 空状态检查 ====================
        isDataEmpty() {
            return !this._loaded || (!this.data.entries || this.data.entries.length === 0);
        },

        showEmptyState(container, title, desc) {
            const tpl = document.getElementById('tpl-empty');
            const clone = tpl.content.cloneNode(true);
            const titleEl = clone.getElementById('empty-title');
            const descEl = clone.getElementById('empty-desc');
            if (titleEl) titleEl.textContent = title || '暂无数据';
            if (descEl) descEl.textContent = desc || '管理员尚未添加内容，请检查存档文件是否正确放置。';
            container.appendChild(clone);
        },

        renderHome(container) {
            const tpl = document.getElementById('tpl-home');
            const clone = tpl.content.cloneNode(true);

            // 欢迎标题
            const welcomeTitle = clone.getElementById('welcome-title');
            const welcomeSubtitle = clone.getElementById('welcome-subtitle');
            if (welcomeTitle) welcomeTitle.textContent = this.data.settings.welcomeTitle || '欢迎来到 Wiki';
            if (welcomeSubtitle) welcomeSubtitle.textContent = this.data.settings.welcomeSubtitle || '探索角色、世界观与错综复杂的关系网。';

            // 公告
            const activeAnn = this.data.announcements?.find(a => a.isActive);
            if (activeAnn) {
                const annSection = clone.getElementById('announcement-section');
                const annTitle = clone.getElementById('announcement-title');
                const annPreview = clone.getElementById('announcement-preview');
                const annMeta = clone.getElementById('announcement-meta');
                if (annSection) annSection.classList.remove('hidden');
                if (annTitle) annTitle.textContent = activeAnn.title || '';
                if (annPreview) annPreview.textContent = this.stripHtml(activeAnn.content || '');
                if (annMeta) annMeta.innerHTML = `<i class="fa-solid fa-user"></i> ${activeAnn.author || '匿名'} <i class="fa-solid fa-calendar"></i> ${activeAnn.date || ''}`;
            }

            // 首页自定义内容
            const homeContentArea = clone.getElementById('home-content-area');
            if (this.data.homeContent && this.data.homeContent.length > 0) {
                this.data.homeContent.forEach(item => {
                    if (item.type === 'entry-ref' && item.entryId) {
                        const entry = this.data.entries.find(e => e.id === item.entryId);
                        if (entry) {
                            const version = entry.versions.find(v => v.vid === item.versionId) || this.getVisibleVersion(entry) || entry.versions[0];
                            if (version) {
                                const card = document.createElement('div');
                                card.className = 'bg-white rounded-xl shadow-sm border border-gray-200 p-4 cursor-pointer hover:shadow-md transition';
                                card.innerHTML = `
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center"><i class="fa-solid fa-bookmark"></i></div>
                                        <div><div class="font-bold text-gray-800 text-sm">${item.title || version.title}</div><div class="text-xs text-gray-500">${entry.code}</div></div>
                                    </div>`;
                                card.onclick = () => this.openEntry(entry.id, item.versionId);
                                homeContentArea.appendChild(card);
                            }
                        }
                    } else if (item.type === 'text') {
                        const div = document.createElement('div');
                        div.className = 'bg-white rounded-xl shadow-sm border border-gray-200 p-4 text-sm text-gray-600';
                        div.textContent = item.content || item.title || '';
                        homeContentArea.appendChild(div);
                    }
                });
            }

            // 历史记录
            this.renderHistory(clone);

            // 【新增】渲染活动窗口
            this.renderHomeEventBanner(clone);

            container.appendChild(clone);

            // 【关键修复】初始化首页分栏必须在 appendChild 之后，否则 getElementById 找不到元素
            this.initHomeColumnControl();
        },

        renderHistory(parent) {
            const historySection = parent.getElementById('history-section');
            const historyList = parent.getElementById('history-list');
            if (!historySection || !historyList) return;
            if (this.data.history && this.data.history.length > 0) {
                historySection.classList.remove('hidden');
                const recent = this.data.history.slice(-10).reverse();
                recent.forEach(h => {
                    const entry = this.data.entries.find(e => e.id === h.id);
                    if (!entry) return;
                    const version = this.getVisibleVersion(entry);
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-3 p-3 bg-white rounded-lg border border-gray-100 cursor-pointer hover:border-indigo-300 transition';
                    item.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-xs text-gray-500 shrink-0"><i class="fa-solid fa-clock-rotate-left"></i></div>
                        <div class="min-w-0"><div class="text-sm font-medium text-gray-700 truncate">${version?.title || entry.code}</div><div class="text-xs text-gray-400">${entry.code}</div></div>`;
                    item.onclick = () => this.openEntry(entry.id);
                    historyList.appendChild(item);
                });
            }
        },

        // ========== 活动页词条功能（GitHub版查看支持）==========
        isEventActive(eventEntry) {
            if (!eventEntry || eventEntry.type !== 'event') return false;
            const dur = eventEntry.duration;
            if (!dur) return true;
            if (dur.type === 'permanent') return true;
            if (dur.type === 'period' && dur.startDate && dur.endDate) {
                const now = new Date();
                const start = new Date(dur.startDate);
                const end = new Date(dur.endDate);
                return now >= start && now <= end;
            }
            return false;
        },

        getEventStatus(eventEntry) {
            if (!eventEntry || eventEntry.type !== 'event') return { label: '未知', className: 'ended' };
            const dur = eventEntry.duration;
            if (!dur || dur.type === 'permanent') return { label: '常态', className: 'permanent' };
            if (dur.type === 'period' && dur.startDate && dur.endDate) {
                const now = new Date();
                const start = new Date(dur.startDate);
                const end = new Date(dur.endDate);
                if (now < start) return { label: '即将开始', className: 'upcoming' };
                if (now > end) return { label: '已结束', className: 'ended' };
                return { label: '进行中', className: 'active' };
            }
            return { label: '进行中', className: 'active' };
        },

        getActiveEvents() {
            const events = this.data.entries.filter(e => e.type === 'event');
            const active = events.filter(e => this.isEventActive(e));
            active.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            return active;
        },

        renderHomeEventBanner(container) {
            const activeEvents = this.getActiveEvents();
            const bannerEl = container.querySelector('#active-event-banner');
            if (!bannerEl) return;
            if (activeEvents.length === 0) { bannerEl.classList.add('hidden'); return; }
            bannerEl.classList.remove('hidden');
            // 恢复轮播索引
            let currentIdx = this._homeBannerIndex || 0;
            if (currentIdx >= activeEvents.length) currentIdx = 0;
            this._homeBannerIndex = currentIdx;
            this._homeBannerEvents = activeEvents;
            const currentEvent = activeEvents[currentIdx];
            const version = this.getVisibleVersion(currentEvent) || currentEvent.versions[0];
            const titleEl = container.querySelector('#active-event-title');
            const descEl = container.querySelector('#active-event-desc');
            const imgEl = container.querySelector('#active-event-image');
            const dotsEl = container.querySelector('#active-event-dots');
            if (titleEl) titleEl.textContent = version?.title || currentEvent.code;
            if (descEl) descEl.textContent = version?.subtitle || '';
            // 【GitHub版】静态文件直接URL访问，无需异步加载机制
            const headerImg = this.resolveImageUrl(currentEvent.headerImage || '');
            if (imgEl) {
                if (headerImg) { imgEl.src = headerImg; imgEl.classList.remove('hidden'); }
                else { imgEl.src = ''; imgEl.classList.add('hidden'); }
            }
            if (dotsEl) {
                dotsEl.innerHTML = '';
                activeEvents.forEach((_, idx) => {
                    const dot = document.createElement('div');
                    dot.className = 'active-event-dot ' + (idx === currentIdx ? 'active' : '');
                    dot.onclick = (e) => { e.stopPropagation(); this._switchHomeBanner(idx); };
                    dotsEl.appendChild(dot);
                });
            }
            const bannerDiv = bannerEl.querySelector('.active-event-banner');
            if (bannerDiv) {
                bannerDiv.onclick = () => {
                    const evts = this._homeBannerEvents || activeEvents;
                    const idx = this._homeBannerIndex || 0;
                    if (evts[idx]) this.openEntry(evts[idx].id);
                };
            }
            this._startHomeBannerAutoPlay();
        },

        _switchHomeBanner(index) {
            const events = this._homeBannerEvents;
            if (!events || !events[index]) return;
            this._homeBannerIndex = index;
            const event = events[index];
            const version = this.getVisibleVersion(event) || event.versions[0];
            const titleEl = document.getElementById('active-event-title');
            const descEl = document.getElementById('active-event-desc');
            const imgEl = document.getElementById('active-event-image');
            const dots = document.querySelectorAll('.active-event-dot');
            if (titleEl) titleEl.textContent = version?.title || event.code;
            if (descEl) descEl.textContent = version?.subtitle || '';
            if (imgEl) {
                // 【GitHub版】静态文件直接URL访问
                imgEl.src = this.resolveImageUrl(event.headerImage || '');
            }
            dots.forEach((d, i) => d.classList.toggle('active', i === index));
        },

        _startHomeBannerAutoPlay() {
            if (this._bannerAutoPlayTimer) clearInterval(this._bannerAutoPlayTimer);
            const events = this._homeBannerEvents;
            if (!events || events.length <= 1) return;
            this._bannerAutoPlayTimer = setInterval(() => {
                const nextIdx = ((this._homeBannerIndex || 0) + 1) % events.length;
                this._switchHomeBanner(nextIdx);
            }, 5000);
        },

        _stopHomeBannerAutoPlay() {
            if (this._bannerAutoPlayTimer) { clearInterval(this._bannerAutoPlayTimer); this._bannerAutoPlayTimer = null; }
        },

        // ========== 首页分栏控制 ==========
        setHomeColumns(cols) {
            cols = parseInt(cols) || 1;
            if (cols < 1) cols = 1;
            if (cols > 3) cols = 3;
            const container = document.getElementById('home-multi-col-container');
            if (container) container.className = 'home-multi-col-' + cols;
            // 【关键修复】单栏时恢复 max-w-3xl（正常左右间距），分栏时去除限制让内容更宽
            const layoutContainer = document.getElementById('home-layout-container');
            if (layoutContainer) {
                if (cols === 1) {
                    layoutContainer.classList.add('max-w-3xl');
                    layoutContainer.style.maxWidth = '';
                } else {
                    layoutContainer.classList.remove('max-w-3xl');
                    layoutContainer.style.maxWidth = '100%';
                }
            }
            document.querySelectorAll('.home-col-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.cols) === cols);
            });
            try { localStorage.setItem('novelWiki_homeColumns', String(cols)); } catch(e) {}
        },

        initHomeColumnControl() {
            const control = document.getElementById('home-column-control');
            if (!control) return;
            control.classList.remove('hidden');
            let cols = 1;
            try { const saved = localStorage.getItem('novelWiki_homeColumns'); if (saved) cols = parseInt(saved) || 1; } catch(e) {}
            this.setHomeColumns(cols);
        },

        openActiveEvent() {
            const activeEvents = this.getActiveEvents();
            if (activeEvents.length > 0) this.openEntry(activeEvents[0].id);
        },

        renderEvents(container) {
            const tpl = document.getElementById('tpl-events');
            if (!tpl) { container.innerHTML = '<div class="p-4 text-center text-gray-500">模板加载失败</div>'; return; }
            const clone = tpl.content.cloneNode(true);
            const listEl = clone.getElementById('events-list');
            const countEl = clone.getElementById('events-count');
            const emptyEl = clone.getElementById('events-empty');
            container.appendChild(clone);
            const events = this.data.entries.filter(e => e.type === 'event');
            if (countEl) countEl.textContent = events.length;
            if (events.length === 0) {
                if (emptyEl) emptyEl.classList.remove('hidden');
                if (listEl) listEl.classList.add('hidden');
                return;
            }
            if (emptyEl) emptyEl.classList.add('hidden');
            events.sort((a, b) => {
                const statusA = this.getEventStatus(a).className;
                const statusB = this.getEventStatus(b).className;
                const order = { active: 0, upcoming: 1, permanent: 0, ended: 2 };
                const orderA = order[statusA] !== undefined ? order[statusA] : 3;
                const orderB = order[statusB] !== undefined ? order[statusB] : 3;
                if (orderA !== orderB) return orderA - orderB;
                return (b.createdAt || 0) - (a.createdAt || 0);
            });
            events.forEach(event => {
                const card = this.createEventCard(event);
                if (card && listEl) listEl.appendChild(card);
            });
        },

        createEventCard(event) {
            const version = this.getVisibleVersion(event) || event.versions[0];
            if (!version) return null;
            const status = this.getEventStatus(event);
            const div = document.createElement('div');
            div.className = 'event-card';
            div.onclick = () => this.openEntry(event.id);
            // 【GitHub版】静态文件直接URL访问，无需异步加载机制
            const headerImg = this.resolveImageUrl(event.headerImage || '');
            const hasImage = !!headerImg;
            let dateText = '';
            const dur = event.duration;
            if (!dur || dur.type === 'permanent') dateText = '常态上线';
            else if (dur.type === 'period' && dur.startDate && dur.endDate) {
                const start = new Date(dur.startDate); const end = new Date(dur.endDate);
                const fmt = (d) => `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                dateText = `${fmt(start)} ~ ${fmt(end)}`;
            }
            // 【关键修复】onerror使用CSS类控制，避免JS引号冲突
            div.innerHTML = `
                <div class="event-card-image">
                    ${hasImage ? `<img src="${headerImg}" alt="${this.escapeHtml(version.title)}" loading="lazy" class="event-img-loadable" onerror="this.classList.add('event-img-failed');">` : '<div class="w-full h-full flex items-center justify-center text-gray-300"><i class="fa-solid fa-image text-3xl"></i></div>'}
                    ${hasImage ? '<div class="event-img-fail-msg hidden" style="position:absolute;inset:0;"><div class="w-full h-full flex items-center justify-center text-gray-300"><i class="fa-solid fa-image text-3xl"></i></div></div>' : ''}
                    <span class="event-card-status ${status.className}">${status.label}</span>
                </div>
                <div class="event-card-body">
                    <div class="event-card-title">${this.escapeHtml(version.title)}</div>
                    <div class="event-card-date"><i class="fa-regular fa-calendar"></i><span>${dateText}</span><span class="ml-2 text-gray-400 font-mono">${event.code}</span></div>
                </div>`;
            return div;
        },

        renderEventDetail(version) {
            if (!version) return '';
            let html = '<div class="prose prose-sm max-w-none mt-4">';
            if (version.blocks && version.blocks.length > 0) {
                version.blocks.forEach(block => {
                    if (block.type === 'h2') html += `<h2 class="text-xl font-bold text-gray-800 mt-6 mb-3 border-b pb-2">${this.escapeHtml(block.text)}</h2>`;
                    else if (block.type === 'h3') html += `<h3 class="text-lg font-semibold text-gray-700 mt-4 mb-2">${this.escapeHtml(block.text)}</h3>`;
                    else if (block.type === 'p') { let text = block.text || ''; text = this.parseContentText(text); html += `<p class="text-gray-600 leading-relaxed mb-4" style="white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;">${text}</p>`; }
                    else if (block.type === 'img') { const imgRef = block.src || ''; let imgSrc = this.resolveImageUrl(imgRef); const caption = block.caption || ''; html += `<div class="event-block-image"><img src="${imgSrc}" data-img-ref="${this.escapeHtml(imgRef)}" alt="${this.escapeHtml(caption)}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'text-gray-400 py-4\'><i class=\'fa-solid fa-image text-2xl\'></i><p class=\'text-xs mt-1\'>图片加载失败</p></div>'">${caption ? `<div class="event-block-image-caption">${this.escapeHtml(caption)}</div>` : ''}</div>`; }
                    else if (block.type === 'table') {
                        // 【新增】表格元件渲染
                        const rows = block.rows || [];
                        if (rows.length > 0) {
                            html += '<div class="overflow-x-auto my-4"><table class="w-full border-collapse bg-white rounded-lg overflow-hidden shadow-sm">';
                            html += '<thead class="bg-gray-100"><tr>';
                            (rows[0] || []).forEach(cell => { html += '<th class="border border-gray-200 p-2 text-xs text-gray-700 font-semibold">' + this.escapeHtml(cell) + '</th>'; });
                            html += '</tr></thead><tbody>';
                            for (let r = 1; r < rows.length; r++) {
                                html += '<tr>';
                                (rows[r] || []).forEach(cell => { html += '<td class="border border-gray-200 p-2 text-sm text-gray-600">' + this.escapeHtml(cell) + '</td>'; });
                                html += '</tr>';
                            }
                            html += '</tbody></table></div>';
                        }
                    }
                });
            } else { html += '<div class="text-gray-400 italic text-center py-8">暂无内容</div>'; }
            html += '</div>';
            return html;
        },

        // ==================== 列表渲染 ====================
        renderList(container, type) {
            if (this.isDataEmpty()) {
                this.showEmptyState(container, '暂无角色数据', '管理员尚未添加角色，请检查存档文件。');
                return;
            }
            const tpl = document.getElementById('tpl-list');
            const clone = tpl.content.cloneNode(true);
            const masonry = clone.getElementById('masonry-container');
            const countBadge = clone.getElementById('list-count');
            const title = clone.getElementById('list-title');

            container.appendChild(clone);

            masonry.className = 'max-w-7xl mx-auto pb-20 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4';
            if (title) title.textContent = type === 'character' ? '角色' : '设定';

            let items = this.data.entries.filter(e => e.type === type);
            items.sort((a, b) => {
                const statusA = this.getCharacterDisplayStatus(a);
                const statusB = this.getCharacterDisplayStatus(b);
                const pinnedA = this.isCharacterPinned(a);
                const pinnedB = this.isCharacterPinned(b);
                if (pinnedA && statusA !== 'future' && (!pinnedB || statusB === 'future')) return -1;
                if (pinnedB && statusB !== 'future' && (!pinnedA || statusA === 'future')) return 1;
                if (statusA === 'future' && statusB !== 'future') return 1;
                if (statusA !== 'future' && statusB === 'future') return -1;
                const levelA = this.getSortLevel(a, statusA);
                const levelB = this.getSortLevel(b, statusB);
                if (levelA !== levelB) return levelA - levelB;
                if (statusA === 'missing' && statusB !== 'missing') return 1;
                if (statusA !== 'missing' && statusB === 'missing') return -1;
                return a.code.localeCompare(b.code);
            });

            if (countBadge) countBadge.textContent = items.length;

            if (items.length === 0) {
                masonry.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">暂无数据</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            items.forEach(entry => {
                let version = this.getVisibleVersion(entry);
                if (!version) version = entry.versions?.[entry.versions.length - 1];
                const status = this.getCharacterDisplayStatus(entry);
                const isPinned = this.isCharacterPinned(entry);
                if (version) {
                    const card = this.createEntryCard(entry, version, status, isPinned);
                    if (card) fragment.appendChild(card);
                }
            });
            masonry.appendChild(fragment);
        },

        createEntryCard(entry, version, status = 'normal', isPinned = false) {
            const div = document.createElement('div');
            let statusClass = '';
            let statusStyle = '';
            let subtitleText = version.subtitle || '';

            if (status === 'future') {
                statusClass = 'opacity-50 future-character';
                statusStyle = 'filter: grayscale(100%) brightness(0.7);';
                subtitleText = '该角色还潜藏于阴影中。';
            } else if (status === 'missing') {
                statusClass = 'opacity-60 missing-character';
                statusStyle = 'filter: brightness(0.6) contrast(0.8);';
            }

            div.className = `bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden cursor-pointer hover:shadow-lg transition-all duration-300 active:scale-95 flex flex-col w-3/4 mx-auto relative ${statusClass}`;
            if (statusStyle) div.style.cssText = statusStyle;

            div.onclick = () => {
                if (status === 'future') this.showFutureConfirmDialog(entry, version);
                else if (status === 'missing') {
                    const missingInfo = this.getMissingInfo(entry);
                    if (missingInfo) this.showMissingConfirmDialog(entry, missingInfo);
                    else this.openEntry(entry.id);
                } else this.openEntry(entry.id);
            };

            // 置顶标记
            if (isPinned && status !== 'future') {
                const pinBadge = document.createElement('div');
                pinBadge.className = 'absolute -top-2 -left-2 w-8 h-8 bg-red-500 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-lg z-20';
                pinBadge.innerHTML = '<i class="fa-solid fa-thumbtack"></i>';
                pinBadge.title = '已置顶';
                div.appendChild(pinBadge);
            }

            // 处理图片（支持dataUrl、http、本地文件夹路径）
            let img = version.images?.card || version.images?.avatar || version.image || '';
            img = this.resolveImageUrl(img);
            const hasImage = img && (img.startsWith('data:') || img.startsWith('http') || img.includes('/wiki-images/'));
            // 【关键修复】onerror中使用CSS类控制，避免JS引号冲突导致SyntaxError
            const imgErrorHandler = `this.style.display='none'; this.parentElement.querySelector('.img-fallback').style.display='flex';`;

            // 重要程度
            let displayLevel = version?.level || entry?.level || 5;
            const isProtagonist = displayLevel === 1;
            const isImportant = displayLevel === 2;
            let badgeHtml = '';
            if (status === 'future') {
                badgeHtml = '<span class="role-badge" style="background: linear-gradient(135deg, #6b7280, #374151);">???</span>';
            } else if (isProtagonist) {
                badgeHtml = '<span class="role-badge badge-protagonist">主角</span>';
            } else if (isImportant) {
                badgeHtml = '<span class="role-badge badge-important">重要</span>';
            }

            div.innerHTML += `
                <div class="relative aspect-[3/4] overflow-hidden bg-gray-100 shrink-0">
                    ${hasImage ?
                        `<img src="${img}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110"
                            loading="lazy"
                            style="${status === 'future' || status === 'missing' ? 'filter: grayscale(100%) brightness(0.6);' : ''}"
                            onerror="${imgErrorHandler}">
                         <div class="img-fallback hidden w-full h-full items-center justify-center text-gray-300"><i class="fa-solid fa-user text-4xl"></i></div>` :
                        `<div class="w-full h-full flex items-center justify-center text-gray-300"><i class="fa-solid fa-user text-4xl"></i></div>`
                    }
                    ${badgeHtml}
                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-3 pt-8">
                        <div class="text-white font-bold text-sm truncate">${version.title}</div>
                        <div class="text-white/80 text-xs font-mono truncate">${entry.code}</div>
                    </div>
                </div>
                <div class="p-3 flex-1 flex flex-col justify-between min-h-[60px]">
                    <p class="text-xs text-gray-500 line-clamp-2 ${status === 'future' ? 'italic text-gray-400' : ''}">${subtitleText}</p>
                </div>`;
            return div;
        },

        // ==================== 设定分类渲染 ====================
        renderSettingsGrouped(container) {
            if (this.isDataEmpty()) {
                this.showEmptyState(container, '暂无设定数据', '管理员尚未添加设定，请检查存档文件。');
                return;
            }
            const tpl = document.getElementById('tpl-list');
            const clone = tpl.content.cloneNode(true);
            const wrapper = clone.getElementById('masonry-container');
            const countBadge = clone.getElementById('list-count');
            const title = clone.getElementById('list-title');
            if (title) title.textContent = '设定';
            container.appendChild(clone);
            wrapper.className = 'max-w-7xl mx-auto pb-20 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4';

            // 【功能4】过滤掉隐藏目录的词条（查看模式下隐藏）
            const hiddenIds = this.data.settings?.hiddenCategory?.entries || [];
            const allSettings = this.data.entries.filter(e => e.type === 'non-character');
            const settings = allSettings.filter(e => !hiddenIds.includes(e.id));
            if (countBadge) countBadge.textContent = settings.length;

            if (settings.length === 0) {
                wrapper.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">暂无设定数据</div>';
                return;
            }

            const groups = {};
            settings.forEach(entry => {
                let type = entry.settingType || 'world';
                let groupKey = type;
                let groupTitle = this.getSettingTypeLabel(type);
                let groupIcon = this.getSettingTypeIcon(type);
                if (type === 'custom' && entry.customSettingType?.trim()) {
                    groupKey = `custom-${entry.customSettingType.trim()}`;
                    groupTitle = entry.customSettingType.trim();
                    groupIcon = 'fa-folder-open';
                }
                if (!groups[groupKey]) groups[groupKey] = { key: groupKey, title: groupTitle, icon: groupIcon, type, items: [] };
                groups[groupKey].items.push(entry);
            });

            // 【功能2】按 categoryOrder 目录排序配置排列
            const catOrder = this.data.settings?.settingConfig?.categoryOrder || [];
            const sortedKeys = Object.keys(groups).sort((a, b) => {
                const ia = catOrder.indexOf(a);
                const ib = catOrder.indexOf(b);
                if (ia >= 0 && ib >= 0) return ia - ib;
                if (ia >= 0) return -1;
                if (ib >= 0) return 1;
                // 默认预设排序
                const typeOrder = ['world', 'document', 'art', 'faction'];
                const aIsPreset = typeOrder.includes(groups[a].type);
                const bIsPreset = typeOrder.includes(groups[b].type);
                if (aIsPreset && !bIsPreset) return -1;
                if (!aIsPreset && bIsPreset) return 1;
                return a.localeCompare(b);
            });

            sortedKeys.forEach(key => {
                const group = groups[key];
                // 【功能3】应用 categoryDisplay 显示配置：排序 + 隐藏
                const displayCfg = this.data.settings?.settingConfig?.categoryDisplay?.[key] || {};
                const displayOrder = displayCfg.displayOrder || [];
                const homeHidden = displayCfg.homeHidden || [];

                // 先过滤未来词条
                let sortedItems = group.items.filter(entry => {
                    const version = this.getVisibleVersion(entry) || entry.versions[0];
                    return this.getSettingTimeStatus(entry, version) !== 'future';
                });

                // 按 displayOrder 排序
                if (displayOrder.length > 0) {
                    sortedItems.sort((a, b) => {
                        const ia = displayOrder.indexOf(a.id);
                        const ib = displayOrder.indexOf(b.id);
                        if (ia >= 0 && ib >= 0) return ia - ib;
                        if (ia >= 0) return -1;
                        if (ib >= 0) return 1;
                        return 0;
                    });
                }

                // 过滤隐藏的，只显示前8个
                const visibleItems = sortedItems.filter(e => !homeHidden.includes(e.id)).slice(0, 8);
                if (visibleItems.length === 0) return;

                const section = document.createElement('div');
                section.className = 'col-span-full mb-6';
                section.innerHTML = `
                    <div class="setting-category-header">
                        <div class="setting-category-title"><i class="fa-solid ${group.icon} text-indigo-600 text-lg"></i><span class="text-lg font-bold text-gray-800">${group.title}</span><span class="setting-count-badge">${sortedItems.length}个</span></div>
                        <button onclick="app.viewSettingCategory('${key}')" class="setting-more-btn">更多 <i class="fa-solid fa-chevron-right text-xs"></i></button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" id="setting-group-${key.replace(/[^a-zA-Z0-9]/g, '-')}"></div>`;
                wrapper.appendChild(section);
                const grid = section.querySelector(`#setting-group-${key.replace(/[^a-zA-Z0-9]/g, '-')}`);
                visibleItems.forEach(entry => {
                    let version = this.getVisibleVersion(entry) || entry.versions[0];
                    if (!version) return;
                    const card = this.createSettingCard(entry, version);
                    grid.appendChild(card);
                });
            });
        },

        createSettingCard(entry, version) {
            const div = document.createElement('div');
            let img = version.images?.card || version.images?.avatar || '';
            img = this.resolveImageUrl(img);
            const hasImage = img && (img.startsWith('data:') || img.startsWith('http') || img.includes('/wiki-images/'));

            div.dataset.hasImage = hasImage ? 'true' : 'false';
            div.className = 'bg-white rounded-lg border border-gray-200 p-3 cursor-pointer hover:shadow-md transition hover:border-indigo-300 flex flex-col relative group';
            div.onclick = () => this.openEntry(entry.id);

            let imageHtml = '';
            if (hasImage) {
                imageHtml = `<div class="aspect-[3/2] bg-gray-100 rounded-lg mb-3 overflow-hidden flex items-center justify-center shrink-0">
                    <img src="${img}" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fa-solid fa-image text-gray-300 text-2xl\\'></i>'">
                </div>`;
            }

            div.innerHTML = `${imageHtml}
                <div class="flex items-center justify-between min-h-[24px] ${!hasImage ? 'mb-1' : ''}">
                    <h4 class="font-bold text-sm text-gray-800 truncate flex-1">${version.title}</h4>
                    <span class="text-[10px] text-gray-400 font-mono ml-2">${entry.code}</span>
                </div>
                <p class="text-xs text-gray-500 mt-1 line-clamp-2">${version.subtitle || ''}</p>
                ${!hasImage ? '<div class="flex-1"></div>' : ''}`;
            return div;
        },

        viewSettingCategory(type) {
            const container = document.getElementById('main-container');
            if (!container) return;
            container.innerHTML = '';
            // 【功能4】过滤掉隐藏目录的词条
            const hiddenIds = this.data.settings?.hiddenCategory?.entries || [];
            let settings = this.data.entries.filter(e => {
                if (e.type !== 'non-character') return false;
                if (hiddenIds.includes(e.id)) return false;
                if (type.startsWith('custom-') && e.settingType === 'custom') return e.customSettingType === type.replace('custom-', '');
                return e.settingType === type;
            });

            // 【功能3】应用 categoryDisplay 显示配置：排序 + 隐藏
            const catKey = type;
            const displayCfg = this.data.settings?.settingConfig?.categoryDisplay?.[catKey] || {};
            const displayOrder = displayCfg.displayOrder || [];
            const homeHidden = displayCfg.homeHidden || [];

            // 按 displayOrder 排序
            if (displayOrder.length > 0) {
                settings.sort((a, b) => {
                    const ia = displayOrder.indexOf(a.id);
                    const ib = displayOrder.indexOf(b.id);
                    if (ia >= 0 && ib >= 0) return ia - ib;
                    if (ia >= 0) return -1;
                    if (ib >= 0) return 1;
                    return 0;
                });
            }

            // 过滤隐藏的
            settings = settings.filter(e => !homeHidden.includes(e.id));

            const wrapper = document.createElement('div');
            wrapper.className = 'h-full overflow-y-auto p-4 fade-in';
            const header = document.createElement('div');
            header.className = 'max-w-7xl mx-auto mb-6';
            const groupTitle = type.startsWith('custom-') ? type.replace('custom-', '') : this.getSettingTypeLabel(type);
            header.innerHTML = `
                <button onclick="app.router('non-characters')" class="mb-4 text-gray-600 hover:text-gray-900 flex items-center gap-1 text-sm"><i class="fa-solid fa-arrow-left"></i> 返回设定</button>
                <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid ${this.getSettingTypeIcon(type.replace('custom-', ''))} text-indigo-600"></i>${groupTitle}<span class="text-sm font-normal text-gray-500 bg-gray-100 px-3 py-1 rounded-full">${settings.length}个</span></h2>`;
            wrapper.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-20';
            if (settings.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">该目录下暂无设定词条</div>';
            } else {
                settings.forEach(entry => {
                    const version = this.getVisibleVersion(entry) || entry.versions[0];
                    if (version) grid.appendChild(this.createSettingCard(entry, version));
                });
            }
            wrapper.appendChild(grid);
            container.appendChild(wrapper);
        },

        // ==================== 详情页渲染（核心修复区域） ====================
        renderDetail(container) {
            const entry = this.data.entries.find(e => e.id === this.data.editingId);
            if (!entry) {
                container.innerHTML = '<div class="p-4 text-red-600">你要找的东西好像消失惹~（条目不存在或已被删除）</div>';
                return;
            }

            // 【功能4】隐藏词条：详情页黑底白字
            const hiddenCfg = this.data.settings?.hiddenCategory;
            const isHiddenEntry = hiddenCfg?.entries?.includes(entry.id);
            if (isHiddenEntry) {
                container.classList.add('hidden-entry-detail');
            } else {
                container.classList.remove('hidden-entry-detail');
            }

            // 【新增】正文词条特殊处理
            const isBodyEntry = entry.type === 'body';
            const bodyChapter = isBodyEntry ? this.data.chapters.find(ch => ch.id === entry.versions[0]?.chapterFrom) : null;
            const bodySynopsis = isBodyEntry && bodyChapter ? this.data.synopsis.find(s => s.chapterId === bodyChapter.id || s.id === bodyChapter.id) : null;

            let version = entry.versions.find(v => v.vid === this.data.viewingVersionId) ||
                          this.getVisibleVersion(entry) ||
                          entry.versions[entry.versions.length - 1];
            if (!version) {
                container.innerHTML = '<div class="p-4 text-red-600">该条目没有内容版本</div>';
                return;
            }

            const timeStatus = this.getVersionTimeStatus(entry, version);
            const confirmKey = `${entry.id}_${version.vid}`;
            if (timeStatus === 'future' && !this.confirmedFutureEntries.has(confirmKey)) {
                this.showFutureConfirmDialog(entry, version, confirmKey);
                return;
            }

            const tpl = document.getElementById('tpl-detail-view');
            if (!tpl) return;
            const clone = tpl.content.cloneNode(true);

            const codeEl = clone.getElementById('detail-code');
            const versionBadge = clone.getElementById('detail-version-badge');
            const versionName = clone.getElementById('detail-version-name');
            const contentEl = clone.getElementById('detail-content');

            if (codeEl) codeEl.textContent = entry.code;
            // 【新增】正文词条重要程度标签
            if (isBodyEntry) {
                const importanceLabels = { 1: ['重要章节', 'bg-orange-100 text-orange-700 border-orange-200'], 2: ['特殊章节', 'bg-purple-100 text-purple-700 border-purple-200'], 3: ['一般章节', 'bg-gray-100 text-gray-500 border-gray-200'] };
                const label = importanceLabels[version.level] || importanceLabels[3];
                const badge = document.createElement('span');
                badge.className = `ml-2 inline-block px-2 py-0.5 text-xs rounded-full border ${label[1]}`;
                badge.textContent = label[0];
                codeEl.parentNode.insertBefore(badge, codeEl.nextSibling);
            }
            // 【新增】正文词条不显示版本切换
            if (versionBadge && versionName && entry.versions.length > 1 && !isBodyEntry) {
                versionBadge.classList.remove('hidden');
                const vIndex = entry.versions.findIndex(v => v.vid === version.vid);
                versionName.textContent = `${vIndex + 1}/${entry.versions.length}`;
            }

            // 处理图片
            let cardImg = version.images?.card || version.images?.avatar || version.image;
            // 【新增】正文词条默认使用剧情梗概图片
            if (isBodyEntry && bodySynopsis && bodySynopsis.image) {
                cardImg = bodySynopsis.image;
            }
            cardImg = this.resolveImageUrl(cardImg);
            // 【修复】正文词条图片支持 {{IMG:}} 格式
            if (isBodyEntry && cardImg && cardImg.startsWith('{{IMG:')) {
                cardImg = this.resolveImageUrl(cardImg);
            }
            const hasImage = cardImg && (cardImg.startsWith('data:') || cardImg.startsWith('http') || cardImg.includes('/wiki-images/'));

            // 【修复】正文词条：剧情梗概文本安全处理
            let synopsisHtmlGh = '';
            if (isBodyEntry && bodySynopsis) {
                try {
                    synopsisHtmlGh = this.parseContentText ? this.parseContentText(bodySynopsis.content || '暂无梗概内容') : (bodySynopsis.content || '暂无梗概内容');
                } catch (e) {
                    console.warn('[renderDetail] parseContentText 失败:', e);
                    synopsisHtmlGh = bodySynopsis.content || '暂无梗概内容';
                }
            }

            // 标题区域
            let headerHtml = `<div class="flex-1 min-w-0">
                <h1 class="text-3xl font-bold text-gray-900 mb-3 leading-tight">${this.escapeHtml(version.title)}</h1>
                ${version.subtitle && !isBodyEntry ? `<div class="text-lg italic text-gray-600 border-l-4 border-indigo-300 pl-4 leading-relaxed" style="white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;">${this.parseInlineMarkdown(this.escapeHtml(version.subtitle))}</div>` : ''}
                ${isBodyEntry && bodySynopsis ? `<div class="text-sm text-gray-500 border-l-4 border-gray-300 pl-4 leading-relaxed bg-gray-50/50 p-3 rounded-r-lg">
                    <div class="text-xs text-gray-400 mb-1 font-medium"><i class="fa-solid fa-book-open mr-1"></i>剧情梗概</div>
                    <div style="white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;">${synopsisHtmlGh}</div>
                </div>` : ''}
            </div>`;

            // 【修复】正文词条图片：原比例、居中、独立一行
            const imageHtml = hasImage ? (isBodyEntry ? `<div class="w-full max-w-2xl mx-auto my-6">
                <div class="rounded-xl overflow-hidden shadow-lg bg-gray-100 border border-gray-200">
                    <img src="${cardImg}" class="w-full h-auto object-contain" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'w-full h-48 flex items-center justify-center text-gray-300\'><i class=\'fa-solid fa-image text-4xl\'></i></div>'" alt="${this.escapeHtml(version.title)}">
                </div>
            </div>` : `<div class="w-56 shrink-0">
                <div class="aspect-[3/4] rounded-xl overflow-hidden shadow-lg bg-gray-100 border border-gray-200 sticky top-24">
                    <img src="${cardImg}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'w-full h-full flex items-center justify-center text-gray-300\'><i class=\'fa-solid fa-image text-4xl\'></i></div>'" alt="${this.escapeHtml(version.title)}">
                </div>
                ${(version.level <= 2 || entry.level <= 2) ? `<div class="text-center mt-3"><span class="inline-block px-4 py-1.5 ${(version.level === 1 || entry.level === 1) ? 'bg-yellow-100 text-yellow-800 border-yellow-200' : 'bg-blue-100 text-blue-800 border-blue-200'} border rounded-full text-sm font-bold">${(version.level === 1 || entry.level === 1) ? '★ 主角' : '重要角色'}</span></div>` : ''}
            </div>`) : '';

            // ========== 核心修复：正文内容渲染（统一索引解析） ==========
            let contentBlocksHtml = '<div class="prose prose-sm max-w-none mt-6">';
            if (version.blocks && version.blocks.length > 0) {
                version.blocks.forEach(block => {
                    if (block.type === 'h2') {
                        contentBlocksHtml += `<h2 class="text-xl font-bold text-gray-800 mt-8 mb-4 border-b pb-2">${this.escapeHtml(block.text)}</h2>`;
                    } else if (block.type === 'h3') {
                        contentBlocksHtml += `<h3 class="text-lg font-bold text-gray-700 mt-6 mb-3">${this.escapeHtml(block.text)}</h3>`;
                    } else if (block.type === 'p') {
                        let text = block.text || '';
                        // 【核心修复】使用统一的索引解析函数
                        text = this.parseContentText(text);
                        contentBlocksHtml += `<p class="text-gray-600 leading-relaxed mb-4" style="white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;">${text}</p>`;
                    } else if (block.type === 'img') {
                        // 【新增】图片元件渲染
                        const imgRef = block.src || '';
                        const imgSrc = this.resolveImageUrl(imgRef);
                        const caption = block.caption || '';
                        contentBlocksHtml += `<div class="event-block-image"><img src="${imgSrc}" alt="${this.escapeHtml(caption)}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'text-gray-400 py-4\'><i class=\'fa-solid fa-image text-2xl\'></i><p class=\'text-xs mt-1\'>图片加载失败</p></div>'">${caption ? `<div class="event-block-image-caption">${this.escapeHtml(caption)}</div>` : ''}</div>`;
                    } else if (block.type === 'table') {
                        // 【新增】表格元件渲染
                        const rows = block.rows || [];
                        if (rows.length > 0) {
                            contentBlocksHtml += '<div class="overflow-x-auto my-4"><table class="w-full border-collapse bg-white rounded-lg overflow-hidden shadow-sm">';
                            contentBlocksHtml += '<thead class="bg-gray-100"><tr>';
                            (rows[0] || []).forEach(cell => { contentBlocksHtml += '<th class="border border-gray-200 p-2 text-xs text-gray-700 font-semibold">' + this.escapeHtml(cell) + '</th>'; });
                            contentBlocksHtml += '</tr></thead><tbody>';
                            for (let r = 1; r < rows.length; r++) {
                                contentBlocksHtml += '<tr>';
                                (rows[r] || []).forEach(cell => { contentBlocksHtml += '<td class="border border-gray-200 p-2 text-sm text-gray-600">' + this.escapeHtml(cell) + '</td>'; });
                                contentBlocksHtml += '</tr>';
                            }
                            contentBlocksHtml += '</tbody></table></div>';
                        }
                    }
                });
            } else {
                contentBlocksHtml += '<div class="text-gray-400 italic">暂无详细内容</div>';
            }
            contentBlocksHtml += '</div>';

            if (contentEl) {
                // 【新增】活动页词条独立渲染：头图在上 → 大标题+活动时间在下 → 内容块
                if (entry.type === 'event') {
                    let eventHtml = '';
                    // 【关键修复】同步解析 headerImage 并直接在 HTML 中设置 src，移除 requestAnimationFrame 异步加载
                    const headerImgRef = entry.headerImage || '';
                    let headerSrc = '';
                    if (headerImgRef.startsWith('data:') || headerImgRef.startsWith('http')) {
                        headerSrc = headerImgRef;
                    } else if (headerImgRef.startsWith('{{IMG:')) {
                        const m = headerImgRef.match(/\{\{IMG:(.+?)\}\}/);
                        if (m) headerSrc = './data/wiki-images/' + m[1];
                    }
                    // 无图片时直接隐藏容器，避免 src="" 触发 onerror
                    const headerDisplay = headerSrc ? '' : 'display:none;';
                    eventHtml += '<div id="event-detail-header" class="w-full rounded-xl overflow-hidden shadow-lg bg-gray-100 border border-gray-200 mb-4" style="' + headerDisplay + '"><img id="event-detail-header-img" src="' + headerSrc + '" class="w-full object-cover" style="aspect-ratio:21/9;" alt="' + this.escapeHtml(version.title) + '" onerror="this.style.display=\'none\'; this.parentElement.classList.add(\'hidden\');"></div>';
                    let dateText = '';
                    const dur = entry.duration;
                    if (!dur || dur.type === 'permanent') dateText = '常态上线';
                    else if (dur.type === 'period' && dur.startDate && dur.endDate) {
                        const s = new Date(dur.startDate); const e = new Date(dur.endDate);
                        const fmt = (d) => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                        dateText = `${fmt(s)} ~ ${fmt(e)}`;
                    }
                    eventHtml += `<div class="mb-4"><h1 class="text-3xl font-bold text-gray-900 leading-tight mb-2">${this.escapeHtml(version.title)}</h1><div class="flex items-center gap-2 text-xs text-gray-500"><span class="font-mono bg-gray-100 px-2 py-0.5 rounded">${entry.code}</span><span><i class="fa-regular fa-calendar mr-1"></i>${dateText}</span></div></div>`;
                    eventHtml += this.renderEventDetail(version);
                    contentEl.innerHTML = eventHtml;
                } else if (isBodyEntry) {
                    // 【修复】正文词条：图片独立居中；其他词条：标题+图片并排
                    contentEl.innerHTML = `${headerHtml}${imageHtml}${contentBlocksHtml}`;
                } else {
                    contentEl.innerHTML = `<div class="flex flex-col md:flex-row gap-6 mb-2">${headerHtml}${imageHtml}</div>${contentBlocksHtml}`;
                }
            }

            // 【回到xx】显示"回到来源词条"按钮（不显示当前词条自己）
            const backBtnArea = clone.getElementById('back-to-prev-btn-area');
            if (backBtnArea && this.data.previousEntryId && this.data.previousEntryName && this.data.previousEntryId !== entry.id) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'px-2 py-1 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 transition text-xs flex items-center gap-1 border border-indigo-200';
                // 添加首次出现章节标注
                const chapterLabel = this.data.previousEntryChapter ? ` <span class="text-[10px] text-gray-400 ml-0.5">\u00b7${this.escapeHtml(this.data.previousEntryChapter)}</span>` : '';
                prevBtn.innerHTML = `<i class="fa-solid fa-reply"></i> 回到'${this.escapeHtml(this.data.previousEntryName)}'${chapterLabel}`;
                prevBtn.onclick = () => this.goBackToPrevious();
                backBtnArea.appendChild(prevBtn);
            }

            // 相关角色
            const relatedSection = clone.getElementById('related-characters-section');
            const relatedList = clone.getElementById('related-characters-list');
            
            // 【新增】活动页词条：隐藏相关角色、版本切换等不适用的区块
            if (entry.type === 'event') {
                const versionHint = clone.getElementById('version-switch-hint');
                const versionBadge = clone.getElementById('detail-version-badge');

                if (versionHint) versionHint.classList.add('hidden');

            if (relatedSection && relatedList && version.relatedCharacters?.length > 0 && entry.type !== 'event') {
                // 【新增】正文词条只显示角色与设定关联
                const validRelations = isBodyEntry ? version.relatedCharacters.filter(rc => {
                    const relatedEntry = this.data.entries.find(e => e.id === rc.charId);

                }) : version.relatedCharacters;
                if (validRelations.length > 0) {
                    relatedSection.classList.remove('hidden');
                    const relatedTitle = relatedSection.querySelector('h3');
                    if (relatedTitle && isBodyEntry) relatedTitle.innerHTML = '<i class="fa-solid fa-users text-indigo-500 mr-2"></i>相关角色与设定';
                    validRelations.forEach(rc => {
                        const charEntry = this.data.entries.find(e => e.id === rc.charId);
                        if (!charEntry) return;

                        tag.className = 'inline-flex items-center gap-1 px-3 py-1 bg-gray-100 hover:bg-indigo-100 rounded-full text-xs cursor-pointer transition';
                        tag.innerHTML = `<span class="font-medium">${this.escapeHtml(charVersion?.title || charEntry.code)}</span><span class="text-gray-400">.${this.escapeHtml(rc.relationName)}</span>`;
                        tag.onclick = () => this.openEntry(charEntry.id);
                        relatedList.appendChild(tag);
                    });
