<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>微光维基</title>
    <script type="module" crossorigin src="./assets/index-CmAVmdHq.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BUJsAGSw.css">
  </head>
  <body>
    <div class="app" data-app data-loading>
      <header class="topbar">
        <div class="topbar__titles">
          <h1 data-title>微光维基</h1>
          <p data-subtitle></p>
        </div>
        <button class="back" data-back hidden>返回</button>
      </header>

      <div class="body">
        <nav class="sidebar" data-nav aria-label="分类"></nav>
        <main class="main">
          <ul class="list" data-list></ul>
          <section class="pane" data-detail hidden></section>
        </main>
      </div>

      <!-- 云云酱：形状由 data-layout 决定（floating / bottom-sheet） -->
      <div class="assistant" data-assistant data-layout="floating">
        <div class="assistant__sheet" data-assistant-sheet hidden>
          <header class="assistant__head">
            <span>云云酱</span>
            <button data-assistant-close aria-label="收起">×</button>
          </header>
          <p class="assistant__hint">问答功能需要站点管理员配置模型后才能使用。</p>
        </div>
        <button class="assistant__toggle" data-assistant-toggle aria-label="打开云云酱">云</button>
      </div>

      <div class="error" data-error-message></div>
    </div>
  </body>
</html>
