        },
        _stripIndexLinks(text) {
            if (!text) return '';
            return text
                .replace(/\[\[[^\]|]+\|[^:\]]+:[^\]]+\]\]/g, (m) => { const x = m.match(/\[\[[^\]|]+\|[^:\]]+:([^\]]+)\]\]/); return x ? x[1] : m; })
                .replace(/\[\[[^:\]]+:[^\]]+\]\]/g, (m) => { const x = m.match(/\[\[[^:\]]+:([^\]]+)\]\]/); return x ? x[1] : m; })
                .replace(/\[\[([^\]]+)\]\]/g, '$1')
                .replace(/@([^\[]+)\[[^\]]+\]/g, '@$1');
        },

        // 【重构】内联图片渲染 — 复用 resolveImageUrl 统一解析
        _renderInlineImages(text) {
            if (!text) return '';
            return text.replace(/\{\{IMG:([^}]+)\}\}/g, (match, filename) => {
                const url = this.resolveImageUrl('{{IMG:' + filename + '}}');
                return '<img src="' + url + '" style="max-width:100%;border-radius:8px;margin:8px 0;" class="synopsis-inline-img" onerror="this.style.display=\'none\'"/>';
            });
        },
        _getCurrentEntryExportData() {
            const entry = this.data.entries.find(e => e.id === this.data.editingId);
            if (!entry) return null;
            const version = entry.versions.find(v => v.vid === this.data.viewingVersionId) || this.getVisibleVersion(entry) || entry.versions[entry.versions.length - 1];
            if (!version) return null;
            const typeLabels = { character: '角色', 'non-character': '设定', body: '正文' };
            const typeLabel = typeLabels[entry.type] || entry.type;
            let chapterRange = '';
            if (version.chapterFrom || version.chapterTo) {
                const fc = this.data.chapters.find(c => c.id === version.chapterFrom);
                const tc = this.data.chapters.find(c => c.id === version.chapterTo);
                const fs = fc ? (fc.num !== undefined ? String(fc.num) : (fc.title || '')) : '';
                const ts = tc ? (tc.num !== undefined ? String(tc.num) : (tc.title || '')) : '';
                if (fs && ts && fs !== ts) chapterRange = fs + ' ~ ' + ts;
                else if (fs) chapterRange = fs;
                else if (ts) chapterRange = ts;
            }
            let allVersions = [];
            if (entry.versions && entry.versions.length > 1) {
                entry.versions.forEach(v => {
                    const isCur = v.vid === version.vid;
                    let vr = '';
                    if (v.chapterFrom || v.chapterTo) {
                        const vf = this.data.chapters.find(c => c.id === v.chapterFrom);
                        const vt = this.data.chapters.find(c => c.id === v.chapterTo);
                        const vfs = vf ? (vf.num !== undefined ? String(vf.num) : (vf.title || '')) : '';
                        const vts = vt ? (vt.num !== undefined ? String(vt.num) : (vt.title || '')) : '';
                        if (vfs && vts && vfs !== vts) vr = vfs + '~' + vts;
                        else if (vfs) vr = vfs;
                        else if (vts) vr = vts;
                    }
                    allVersions.push({ title: v.title, isCurrent: isCur, range: vr, vid: v.vid });
                });
            }
            let relations = [];
            const relChars = version.relatedCharacters || [];
            if (entry.type === 'character' && relChars.length > 0) {
                relChars.forEach(rc => {
                    const re = this.data.entries.find(e => e.id === rc.charId);
                    if (re) { const rv = re.versions ? re.versions[0] : null; relations.push({ name: rv ? rv.title : re.code, relationName: rc.relationName || '相关', code: re.code }); }
                });
            }
            let synopsis = null, synopsisHtml = '';
            if (entry.type === 'body') {
                const chapterId = version.chapterFrom;
                const bs = chapterId && this.data.synopsis ? this.data.synopsis.find(s => s.chapterId === chapterId) : null;
                if (bs && bs.content) {
                    synopsis = this._stripIndexLinks(this.stripHtml(bs.content));
                    let rendered = this.escapeHtml(synopsis);
                    rendered = this._renderInlineImages(rendered);
                    synopsisHtml = rendered.replace(/\n/g, '<br>');
                }
            }
            let contentText = '', contentMarkdown = '', contentHtml = '';
            let coverImage = '';
            if (version.images && version.images.cover) coverImage = version.images.cover;
            else if (version.image) coverImage = version.image;
            else if (version.images && version.images.card) coverImage = version.images.card;
            if (version.blocks && version.blocks.length > 0) {
                version.blocks.forEach(block => {
                    const raw = block.text || '';
                    const plain = this._stripIndexLinks(raw);
                    const safe = this.escapeHtml(plain);
                    if (block.type === 'h2') { contentText += plain + '\n\n'; contentMarkdown += '## ' + plain + '\n\n'; contentHtml += '<h2 style="font-size:22px;font-weight:bold;color:#1f2937;margin:28px 0 12px;border-bottom:2px solid #4f46e5;padding-bottom:8px;">' + safe + '</h2>'; }
                    else if (block.type === 'h3') { contentText += plain + '\n\n'; contentMarkdown += '### ' + plain + '\n\n'; contentHtml += '<h3 style="font-size:18px;font-weight:bold;color:#374151;margin:18px 0 8px;">' + safe + '</h3>'; }
                    else if (block.type === 'p') { contentText += plain + '\n\n'; contentMarkdown += plain + '\n\n'; let rendered = this.parseInlineMarkdown ? this.parseInlineMarkdown(plain) : safe; contentHtml += '<p style="font-size:15px;line-height:1.8;color:#4b5563;margin:10px 0;text-align:justify;">' + rendered + '</p>'; }
                    else if (block.type === 'image') { const imgUrl = this.resolveImageUrl(block.src || ''); if (imgUrl) contentHtml += '<div style="margin:16px 0;text-align:center;"><img src="' + imgUrl + '" style="max-width:100%;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);" onerror="this.style.display=\'none\'"/></div>'; }
                });
            }
            const mark = this.data.settings?.exportMark;
            let markText = '', markMarkdown = '', markHtml = '';
            if (mark && mark.enabled) {
                if (mark.text) { markText = '\n---\n' + mark.text; markMarkdown = '\n\n---\n\n' + mark.text; markHtml += '<div style="margin-top:24px;padding-top:16px;border-top:2px solid #e5e7eb;color:#6b7280;font-size:13px;">' + this.escapeHtml(mark.text).replace(/\n/g, '<br>') + '</div>'; }
                if (mark.image) { const miu = this.resolveImageUrl(mark.image); markHtml += '<div style="margin-top:12px;text-align:center;"><img src="' + miu + '" style="max-width:200px;max-height:80px;border-radius:4px;" onerror="this.style.display=\'none\'"/></div>'; }
            }
            return { entry, version, typeLabel, chapterRange, allVersions, relations, synopsis, synopsisHtml, contentText, contentMarkdown, contentHtml, coverImage, markText, markMarkdown, markHtml, mark };
        },
        exportEntryAsTxt() {
            const d = this._getCurrentEntryExportData();
            if (!d) return;
            let txt = '';
            txt += '╔' + '═'.repeat(40) + '╗\n';
            const pad = Math.max(0, Math.floor((40 - d.version.title.length) / 2));
            txt += '║' + ' '.repeat(pad) + d.version.title + ' '.repeat(Math.max(0, 40 - d.version.title.length - pad)) + '║\n';
            txt += '╠' + '═'.repeat(40) + '╣\n';
            txt += '║ 编号: ' + d.entry.code + ' '.repeat(Math.max(0, 32 - String(d.entry.code).length)) + '║\n';
            txt += '║ 类型: ' + d.typeLabel + ' '.repeat(Math.max(0, 32 - d.typeLabel.length)) + '║\n';
            if (d.chapterRange) txt += '║ 章节: ' + d.chapterRange + ' '.repeat(Math.max(0, 32 - d.chapterRange.length)) + '║\n';
            txt += '╚' + '═'.repeat(40) + '╝\n\n';
            if (d.allVersions.length > 0) { txt += '【版本】\n'; d.allVersions.forEach(v => { txt += (v.isCurrent ? '  ▶ ' : '  ○ ') + v.title + (v.range ? ' (' + v.range + ')' : '') + '\n'; }); txt += '\n'; }
            if (d.relations.length > 0) { txt += '【关系】\n'; d.relations.forEach(r => { txt += '  • ' + r.name + ' — ' + r.relationName + '\n'; }); txt += '\n'; }
            if (d.synopsis) txt += '【剧情梗概】\n' + d.synopsis + '\n\n';
            if (d.version.subtitle) txt += '【题记】\n  "' + this.stripHtml(d.version.subtitle) + '"\n\n';
            if (d.contentText.trim()) txt += '【内容】\n\n' + d.contentText;
            if (d.markText) txt += d.markText;
            txt += '\n\n── 导自 ' + (this.data.settings?.name || 'Wiki') + ' ──';
            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = d.version.title + '_' + d.entry.code + '.txt'; a.click(); URL.revokeObjectURL(url);
            this.showToast('TXT导出成功', 'success'); this.closeShareDialog();
        },
        exportEntryAsMarkdown() {
            const d = this._getCurrentEntryExportData();
            if (!d) return;
            let md = '# ' + d.version.title + '\n\n> **编号**: `' + d.entry.code + '`\n> **类型**: ' + d.typeLabel + '\n';
            if (d.chapterRange) md += '> **章节**: ' + d.chapterRange + '\n';
            md += '\n---\n\n';
            if (d.allVersions.length > 0) { md += '## 版本\n\n'; d.allVersions.forEach(v => { md += '- ' + (v.isCurrent ? '**【当前】** ' : '') + v.title + (v.range ? ' (`' + v.range + '`)' : '') + '\n'; }); md += '\n'; }
            if (d.relations.length > 0) { md += '## 关系\n\n'; d.relations.forEach(r => { md += '- **' + r.name + '** — ' + r.relationName + '\n'; }); md += '\n'; }
            if (d.synopsis) md += '## 剧情梗概\n\n' + d.synopsis + '\n\n';
            if (d.version.subtitle) md += '## 题记\n\n> ' + this.stripHtml(d.version.subtitle) + '\n\n';
            if (d.contentMarkdown.trim()) md += d.contentMarkdown;
            if (d.markMarkdown) md += d.markMarkdown;
            md += '\n\n---\n\n*导自 ' + (this.data.settings?.name || 'Wiki') + '*\n';
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = d.version.title + '_' + d.entry.code + '.md'; a.click(); URL.revokeObjectURL(url);
            this.showToast('Markdown导出成功', 'success'); this.closeShareDialog();
        },
        async exportEntryAsImage() {
            if (typeof html2canvas === 'undefined') { this.showToast('正在加载图片导出库...', 'info'); try { await this._loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'); } catch (e) { this.showToast('图片导出库加载失败', 'error'); return; } }
            const d = this._getCurrentEntryExportData();
            if (!d) return;
            const container = document.createElement('div');
            container.style.cssText = 'position:fixed;left:-9999px;top:0;width:800px;background:#ffffff;padding:48px;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;z-index:-1;';
            let headerFlex = '';
            if (d.coverImage) {
                headerFlex = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:8px;padding-bottom:24px;border-bottom:3px solid #4f46e5;"><div style="flex:1;min-width:0;"><div style="display:inline-block;padding:4px 14px;background:#4f46e5;color:#fff;font-size:12px;border-radius:12px;margin-bottom:12px;">' + this.escapeHtml(d.typeLabel) + '</div><h1 style="font-size:30px;font-weight:bold;color:#1f2937;margin:0 0 8px;line-height:1.3;">' + this.escapeHtml(d.version.title) + '</h1><div style="font-size:13px;color:#6b7280;font-family:monospace;">' + d.entry.code + (d.chapterRange ? ' · 第' + this.escapeHtml(d.chapterRange) + '章' : '') + '</div></div><div style="flex-shrink:0;"><img src="' + d.coverImage + '" style="width:200px;max-height:320px;height:auto;object-fit:cover;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.15);" onerror="this.style.display=\'none\'"/></div></div>';
            } else {
                headerFlex = '<div style="text-align:center;margin-bottom:8px;padding-bottom:24px;border-bottom:3px solid #4f46e5;"><div style="display:inline-block;padding:4px 14px;background:#4f46e5;color:#fff;font-size:12px;border-radius:12px;margin-bottom:12px;">' + this.escapeHtml(d.typeLabel) + '</div><h1 style="font-size:30px;font-weight:bold;color:#1f2937;margin:0 0 8px;line-height:1.3;">' + this.escapeHtml(d.version.title) + '</h1><div style="font-size:13px;color:#6b7280;font-family:monospace;">' + d.entry.code + (d.chapterRange ? ' · 第' + this.escapeHtml(d.chapterRange) + '章' : '') + '</div></div>';
            }
            let extra = '';
            if (d.allVersions.length > 0) { let vh = '<div style="margin:20px 0;padding:16px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;"><div style="font-size:13px;font-weight:bold;color:#475569;margin-bottom:10px;">📋 版本</div>'; d.allVersions.forEach(v => { vh += '<div style="font-size:14px;color:#334155;padding:4px 0;">' + (v.isCurrent ? '<span style="color:#4f46e5;font-weight:bold;">▶</span> ' : '<span style="color:#94a3b8;">○</span> ') + this.escapeHtml(v.title) + (v.range ? ' <span style="color:#94a3b8;font-size:12px;">(' + this.escapeHtml(v.range) + ')</span>' : '') + '</div>'; }); vh += '</div>'; extra += vh; }
            if (d.relations.length > 0) { let rh = '<div style="margin:20px 0;padding:16px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;"><div style="font-size:13px;font-weight:bold;color:#166534;margin-bottom:10px;">🔗 关系</div><div style="display:flex;flex-wrap:wrap;gap:8px;">'; d.relations.forEach(r => { rh += '<span style="display:inline-block;padding:6px 12px;background:#dcfce7;border-radius:20px;font-size:13px;color:#15803d;">' + this.escapeHtml(r.name) + '<span style="color:#86efac;margin:0 4px;">·</span>' + this.escapeHtml(r.relationName) + '</span>'; }); rh += '</div></div>'; extra += rh; }
            if (d.synopsisHtml) { extra += '<div style="margin:20px 0;padding:16px;background:#fffbeb;border-radius:8px;border:1px solid #fde68a;"><div style="font-size:13px;font-weight:bold;color:#92400e;margin-bottom:10px;">📖 剧情梗概</div><div style="font-size:14px;color:#78350f;line-height:1.8;">' + d.synopsisHtml + '</div></div>'; }
            let subH = '';
            if (d.version.subtitle) { subH = '<div style="margin:20px 0;padding:16px 20px;border-left:4px solid #4f46e5;background:#eef2ff;border-radius:0 8px 8px 0;font-size:15px;color:#4338ca;font-style:italic;line-height:1.8;">' + (this.parseInlineMarkdown ? this.parseInlineMarkdown(this.stripHtml(d.version.subtitle)) : this.escapeHtml(this.stripHtml(d.version.subtitle))) + '</div>'; }
            container.innerHTML = '<div style="max-width:720px;margin:0 auto;">' + headerFlex + extra + subH + '<div style="margin-top:24px;">' + d.contentHtml + '</div>' + d.markHtml + '<div style="margin-top:40px;padding-top:16px;border-top:1px solid #e5e7eb;text-align:center;font-size:12px;color:#9ca3af;">导自 ' + this.escapeHtml(this.data.settings?.name || 'Wiki') + '</div></div>';
            document.body.appendChild(container);
            await new Promise(r => setTimeout(r, 300));
            await Promise.all(Array.from(container.querySelectorAll('img')).map(img => new Promise(r => { if (img.complete) r(); else { img.onload = r; img.onerror = r; } })));
            try { const canvas = await html2canvas(container, { scale: 1.5, useCORS: true, backgroundColor: '#ffffff', logging: false }); const url = canvas.toDataURL('image/png'); const a = document.createElement('a'); a.href = url; a.download = d.version.title + '_' + d.entry.code + '.png'; a.click(); this.showToast('图片导出成功', 'success'); } catch (e) { console.error('图片导出失败:', e); this.showToast('图片导出失败', 'error'); } finally { container.remove(); }
            this.closeShareDialog();
        },
        _loadScript(src) { return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = reject; document.head.appendChild(s); }); },
        updateExportMarkEnabled(enabled) { if (!this.data.settings.exportMark) this.data.settings.exportMark = { enabled: false, text: '' }; this.data.settings.exportMark.enabled = enabled; },
        updateExportMarkText(text) { if (!this.data.settings.exportMark) this.data.settings.exportMark = { enabled: false, text: '' }; this.data.settings.exportMark.text = text; },

        // ==================== 键盘导航 ====================
        initKeyboardListeners() {
            if (this._keyboardHandler) document.removeEventListener('keydown', this._keyboardHandler);
            this._keyboardHandler = (e) => {
                if (this.data.currentView !== 'synopsis') return;
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
                if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); this.navigateSynopsis(-1); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); this.navigateSynopsis(1); }
                else if (e.key === 'Escape') { this.closeSynopsisTooltip(); }
            };
            document.addEventListener('keydown', this._keyboardHandler, true);
        },

        // ==================== 【新增】关于页面 ==========
        viewAbout() {
            const about = this.data.about;
            if (!about) { this.showToast('暂无关于信息', 'info'); return; }
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/60 z-[99999] flex items-center justify-center p-4 fade-in';
            overlay.id = 'about-overlay';
            const markdownHtml = about.content ? this.parseMarkdown(about.content) : '<p class="text-gray-400 italic">暂无内容</p>';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden">
                    <div class="p-4 border-b bg-gradient-to-r from-indigo-50 to-purple-50 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-xl text-gray-800">${this.escapeHtml(about.title || '关于')}</h3>
                            <p class="text-xs text-gray-500 mt-1">${about.author ? this.escapeHtml(about.author) + ' \u00b7 ' : ''}${about.date || ''}</p>
                        </div>
                        <button onclick="document.getElementById('about-overlay').remove()" class="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition"><i class="fa-solid fa-times"></i></button>
                    </div>
                    <div class="p-6 overflow-y-auto prose prose-sm max-w-none">${markdownHtml}</div>
                    <div class="p-4 border-t bg-gray-50 text-center">
                        <button onclick="document.getElementById('about-overlay').remove()" class="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition text-sm">关闭</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
        },

        parseMarkdown(text) {
            if (!text) return '';
            let html = this.escapeHtml(text);
            html = html.replace(/^###### (.*$)/gim, '<h6 class="text-sm font-bold text-gray-700 mt-4 mb-2">$1</h6>');
            html = html.replace(/^##### (.*$)/gim, '<h5 class="text-base font-bold text-gray-700 mt-4 mb-2">$1</h5>');
            html = html.replace(/^#### (.*$)/gim, '<h4 class="text-lg font-bold text-gray-800 mt-4 mb-2">$1</h4>');
            html = html.replace(/^### (.*$)/gim, '<h3 class="text-xl font-bold text-gray-800 mt-6 mb-3 border-b pb-1">$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold text-gray-900 mt-8 mb-4 border-b pb-2">$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1 class="text-3xl font-bold text-gray-900 mt-8 mb-4">$1</h1>');
            html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');
            html = html.replace(/`([^`]+)`/g, '<code class="bg-gray-100 px-1.5 py-0.5 rounded text-sm font-mono text-pink-600">$1</code>');
            html = html.replace(/```([\s\S]*?)```/g, '<pre class="bg-gray-800 text-gray-100 p-4 rounded-lg overflow-x-auto text-sm my-4"><code>$1</code></pre>');
            html = html.replace(/^> (.*$)/gim, '<blockquote class="border-l-4 border-indigo-300 pl-4 my-4 text-gray-600 italic">$1</blockquote>');
            html = html.replace(/^---$/gim, '<hr class="my-6 border-gray-200">');
            html = html.replace(/^\* \* \*$/gim, '<hr class="my-6 border-gray-200">');
            html = html.replace(/^___$/gim, '<hr class="my-6 border-gray-200">');
            html = html.replace(/^\- (.*$)/gim, '<li class="ml-4 my-1 flex items-start gap-2"><span class="text-indigo-500 mt-1.5 text-xs">\u25cf</span><span>$1</span></li>');
            html = html.replace(/^\* (.*$)/gim, '<li class="ml-4 my-1 flex items-start gap-2"><span class="text-indigo-500 mt-1.5 text-xs">\u25cf</span><span>$1</span></li>');
            html = html.replace(/^\d+\. (.*$)/gim, '<li class="ml-4 my-1 flex items-start gap-2"><span class="text-indigo-500 font-bold min-w-[1.5rem]">$&</span></li>');
            html = html.replace(/<span class="text-indigo-500 font-bold min-w-\[1\.5rem\]">(\d+)\.\s(.*?)<\/span>/g, '<span class="text-indigo-500 font-bold min-w-[1.5rem]">$1.</span><span>$2</span>');
            html = html.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank" class="text-indigo-600 hover:underline">$1</a>');
            html = html.replace(/<(https?:\/\/[^ >]+)>/g, '<a href="$1" target="_blank" class="text-indigo-600 hover:underline">$1</a>');
            html = html.replace(/!\[([^\]]*)\]\(([^\)]+)\)/g, '<img src="$2" alt="$1" class="max-w-full rounded-lg my-4">');
            // 表格
            const lines = html.split('\n');
            let inTable = false, tableHtml = [], result = [];
            for (const line of lines) {
                if (line.includes('|') && !inTable) { inTable = true; tableHtml = []; }
                if (inTable) {
                    if (!line.includes('|')) {
                        if (tableHtml.length > 0) {
                            result.push('<table class="min-w-full my-4 border-collapse border border-gray-200 rounded-lg overflow-hidden">');
                            tableHtml.forEach((row, idx) => { const tag = idx === 0 ? 'th' : 'td'; const bgClass = idx === 0 ? 'bg-gray-100 font-bold' : 'bg-white'; const cells = row.split('|').map(c => c.trim()).filter(c => c); if (cells.length > 0) { result.push(`<tr class="${bgClass} border-b border-gray-200">`); cells.forEach(cell => { result.push(`<${tag} class="px-4 py-2 text-left text-sm ${idx === 0 ? 'text-gray-700' : 'text-gray-600'}">${cell}</${tag}>`); }); result.push('</tr>'); } });
                            result.push('</table>');
                        }
                        inTable = false;
                    } else { tableHtml.push(line); continue; }
                }
                result.push(line);
            }
            html = result.join('\n');
            html = html.replace(/^(?!<[a-z]|<\/|<li|<\/li|<hr|<pre|<blockquote|<table|<\/table|<tr|<\/tr|<td|<\/td|<th|<\/th|<h|<code|<img|<a)(.+)$/gim, '<p class="my-2 text-gray-700 leading-relaxed">$1</p>');
            html = html.replace(/<p class="my-2 text-gray-700 leading-relaxed"><\/p>/g, '');
            return html;
        },

        // ==================== 【新增】正文词条管理 ==========
        syncBodyEntriesWithChapters() {
            if (!this.data.chapters || this.data.chapters.length === 0) return;
            const sortedChapters = [...this.data.chapters].sort((a, b) => a.order - b.order);
            // 1. 删除没有对应章节的正文词条
            this.data.entries = this.data.entries.filter(e => {
                if (e.type !== 'body') return true;
                const chapterId = e.versions[0]?.chapterFrom;
                return sortedChapters.some(ch => ch.id === chapterId);
            });
            // 2. 为没有正文词条的章节创建正文词条
            sortedChapters.forEach(ch => {
                const existingBody = this.data.entries.find(e => e.type === 'body' && e.versions[0]?.chapterFrom === ch.id);
                if (!existingBody) this.createBodyEntry(ch);
            });
            // 3. 同步标题
            this.data.entries.forEach(e => {
                if (e.type !== 'body' || !e.versions[0]) return;
                const ch = sortedChapters.find(c => c.id === e.versions[0].chapterFrom);
                if (ch) e.versions[0].title = ch.title || `第${this.formatChapterNum(ch.num)}章`;
            });
        },

        createBodyEntry(chapter) {
            // 生成B-编号
            const bodyEntries = this.data.entries.filter(e => e.type === 'body');
            const usedNumbers = bodyEntries.map(e => { const m = e.code.match(/B-(\d+)/); return m ? parseInt(m[1]) : 0; });
            let nextNum = 1; while (usedNumbers.includes(nextNum)) nextNum++;
            const code = 'B-' + String(nextNum).padStart(3, '0');
            const bodyEntry = {
                id: 'body-' + chapter.id,
                type: 'body',
                code: code,
                camp: null,
                settingType: null,
                versions: [{
                    vid: 'v-body-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                    title: chapter.title || `第${this.formatChapterNum(chapter.num)}章`,
                    subtitle: '',
                    level: 3,
                    image: null,
                    images: { avatar: null, card: null, cover: null },
                    chapterFrom: chapter.id,
                    chapterTo: null,
                    blocks: [],
                    relatedCharacters: [],
                    relatedVersions: [],
                    createdAt: Date.now()
                }]
            };
            this.data.entries.push(bodyEntry);
        },

        openBodyEntry(chapterId) {
            const bodyEntry = this.data.entries.find(e => e.type === 'body' && e.versions[0]?.chapterFrom === chapterId);
            if (!bodyEntry) { this.showToast('该章节暂无正文词条', 'warning'); return; }
            // 【回到xx】正文词条间跳转（上一章/下一章）清空记录；从非正文词条查看正文则记录
            if (this.data.editingId) {
                const currentEntry = this.data.entries.find(e => e.id === this.data.editingId);
                if (currentEntry && currentEntry.type === 'body') {
                    this._clearPreviousEntry();
                } else if (currentEntry) {
                    this._recordPreviousEntry();
                }
            }
            this.openEntry(bodyEntry.id);
        },

        navigateBodyEntry(direction) {
            const entry = this.data.entries.find(e => e.id === this.data.editingId);
            if (!entry || entry.type !== 'body' || !entry.versions[0]) return;
            const currentChapterId = entry.versions[0].chapterFrom;
            const sortedChapters = [...this.data.chapters].sort((a, b) => a.order - b.order);
            const currentIdx = sortedChapters.findIndex(ch => ch.id === currentChapterId);
            if (currentIdx === -1) return;
            const newIdx = currentIdx + direction;
            if (newIdx < 0 || newIdx >= sortedChapters.length) { this.showToast('已经是' + (direction < 0 ? '第一章' : '最后一章'), 'info'); return; }
            this.openBodyEntry(sortedChapters[newIdx].id);
        },

        // 【回到xx】记录当前查看的词条作为"来源"（在跳转到新词条前调用）
        _recordPreviousEntry() {
            if (this.data.editingId) {
                const currentEntry = this.data.entries.find(e => e.id === this.data.editingId);
                if (currentEntry) {
                    let currentVersion = this.data.viewingVersionId
                        ? currentEntry.versions.find(v => v.vid === this.data.viewingVersionId)
                        : null;
                    if (!currentVersion) currentVersion = this.getVisibleVersion(currentEntry);
                    this.data.previousEntryId = this.data.editingId;
                    this.data.previousEntryName = currentVersion?.title || currentEntry.code;
                    this.data.previousEntryType = currentEntry.type;
                    this.data.previousVersionId = this.data.viewingVersionId || currentVersion?.vid || null;
                    const chapterFrom = currentVersion?.chapterFrom;
                    if (chapterFrom) {
                        const ch = this.data.chapters.find(c => c.id === chapterFrom);
                        this.data.previousEntryChapter = ch ? this.formatChapterNum(ch.num) : null;
                    } else {
                        this.data.previousEntryChapter = null;
                    }
                }
            }
        },

        // 【回到xx】清空记录
        _clearPreviousEntry() {
            this.data.previousEntryId = null;
            this.data.previousEntryName = null;
            this.data.previousEntryType = null;
            this.data.previousEntryChapter = null;
            this.data.previousVersionId = null;
        },

        goBackToPrevious() {
            if (this.data.previousEntryId) {
                const prevId = this.data.previousEntryId;
                const prevVersionId = this.data.previousVersionId;
                // 【关键】使用"回到"后清空记录，不保留链式跳转
                this._clearPreviousEntry();
                if (prevVersionId) {
                    this.openEntry(prevId, prevVersionId);
                } else {
                    this.openEntry(prevId);
                }
            }
        }
    };

    // ==================== 启动 ====================
    document.addEventListener('DOMContentLoaded', () => app.init());
    </script>

    <!-- 【新增】关于悬浮按键 -->
    <div id="about-float-btn" class="fixed z-[9999] bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-lg cursor-pointer flex items-center justify-center transition-all hover:scale-110"
         style="width: 48px; height: 48px; bottom: 20px; right: 20px;"
         onclick="app.viewAbout()"
         title="关于">
        <i class="fa-solid fa-info text-lg"></i>
    </div>
    <style>
        #about-float-btn { 
            position: fixed !important;
            transition: all 0.3s ease;
        }
        #about-float-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        }
        #about-float-btn.dragging {
            opacity: 0.8;
            cursor: grabbing !important;
        }
    </style>
    <script>
        // 可拖拽功能
        (function() {
            const btn = document.getElementById('about-float-btn');
            if (!btn) return;
            let isDragging = false, startX, startY, initialLeft, initialTop;
            btn.addEventListener('mousedown', function(e) {
                isDragging = true;
                btn.classList.add('dragging');
                startX = e.clientX;
                startY = e.clientY;
                const rect = btn.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
                e.preventDefault();
            });
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                btn.style.left = (initialLeft + dx) + 'px';
                btn.style.top = (initialTop + dy) + 'px';
                btn.style.bottom = 'auto';
                btn.style.right = 'auto';
            });
            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    btn.classList.remove('dragging');
                }
            });
            // 触摸支持
            btn.addEventListener('touchstart', function(e) {
                isDragging = true;
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                const rect = btn.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
            }, {passive: true});
            document.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                const touch = e.touches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                btn.style.left = (initialLeft + dx) + 'px';
                btn.style.top = (initialTop + dy) + 'px';
                btn.style.bottom = 'auto';
                btn.style.right = 'auto';
            }, {passive: true});
            document.addEventListener('touchend', function() {
                isDragging = false;
            });
        })();
    </script>
