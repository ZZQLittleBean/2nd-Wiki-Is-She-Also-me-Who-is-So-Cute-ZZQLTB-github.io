            }

            // 【新增】正文词条章节导航
            if (isBodyEntry && bodyChapter) {
                const navDiv = document.createElement('div');
                navDiv.className = 'mt-6 flex items-center justify-between bg-gray-50 rounded-lg p-4 border border-gray-200';
                const sortedChapters = [...this.data.chapters].sort((a, b) => a.order - b.order);
                const currentIdx = sortedChapters.findIndex(ch => ch.id === bodyChapter.id);
                const prevChapter = currentIdx > 0 ? sortedChapters[currentIdx - 1] : null;
                const nextChapter = currentIdx < sortedChapters.length - 1 ? sortedChapters[currentIdx + 1] : null;
                navDiv.innerHTML = `
                    <button onclick="app.navigateBodyEntry(-1)" class="flex items-center gap-2 px-4 py-2 rounded-lg transition ${prevChapter ? 'text-indigo-600 hover:bg-indigo-50' : 'text-gray-300 cursor-not-allowed'}" ${!prevChapter ? 'disabled' : ''}><i class="fa-solid fa-chevron-left"></i><div class="text-left"><div class="text-xs opacity-70">上一章</div><div class="text-sm font-medium">${prevChapter ? this.escapeHtml(prevChapter.title || this.formatChapterNum(prevChapter.num)) : '无'}</div></div></button>
                    <div class="text-center"><div class="text-xs text-gray-400">${this.escapeHtml(this.formatChapterNum(bodyChapter.num))}</div>${bodyChapter.title ? `<div class="text-sm font-bold text-gray-700">${this.escapeHtml(bodyChapter.title)}</div>` : ''}</div>
                    <button onclick="app.navigateBodyEntry(1)" class="flex items-center gap-2 px-4 py-2 rounded-lg transition ${nextChapter ? 'text-indigo-600 hover:bg-indigo-50' : 'text-gray-300 cursor-not-allowed'}" ${!nextChapter ? 'disabled' : ''}><div class="text-right"><div class="text-xs opacity-70">下一章</div><div class="text-sm font-medium">${nextChapter ? this.escapeHtml(nextChapter.title || this.formatChapterNum(nextChapter.num)) : '无'}</div></div><i class="fa-solid fa-chevron-right"></i></button>`;
                contentEl.appendChild(navDiv);
            }

            // 版本切换提示
            const versionHint = clone.getElementById('version-switch-hint');
            const versionList = clone.getElementById('version-switch-list');
            if (versionHint && versionList && entry.versions.length > 1) {
                const otherVersions = entry.versions.filter(v => v.vid !== version.vid);
                if (otherVersions.length > 0) {
                    versionHint.classList.remove('hidden');
                    otherVersions.forEach(v => {
                        const vStatus = this.getVersionTimeStatus(entry, v);
                        const btn = document.createElement('button');
                        btn.className = `text-xs px-3 py-1 rounded-full border transition ${vStatus === 'current' ? 'bg-indigo-100 border-indigo-300 text-indigo-700' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'}`;
                        // 添加首次出现章节标注，便于区分同名不同版本
                        const vChapter = v.chapterFrom ? this.data.chapters.find(c => c.id === v.chapterFrom) : null;
                        const vChapterLabel = vChapter ? `\u00b7${this.formatChapterNum(vChapter.num)}` : '';
                        btn.innerHTML = `${this.escapeHtml(v.title)} ${vChapterLabel ? `<span class="text-[10px] text-gray-400 ml-0.5">${vChapterLabel}</span>` : ''} ${vStatus !== 'current' ? `<span class="text-[10px] opacity-70">(${vStatus === 'past' ? '过去' : '未来'})</span>` : ''}`;
                        btn.onclick = () => {
                            if (vStatus === 'future') {
                                const vConfirmKey = `${entry.id}_${v.vid}`;
                                this.data.viewingVersionId = v.vid;
                                if (this.confirmedFutureEntries.has(vConfirmKey)) this.router('detail', false);
                                else this.showFutureConfirmDialog(entry, v, vConfirmKey);
                            } else {
                                this.data.viewingVersionId = v.vid;
                                this.router('detail', false);
                            }
                        };
                        versionList.appendChild(btn);
                    });
                }
            }

            container.appendChild(clone);
        },

        // ==================== 【核心修复】统一索引解析 ====================
        parseContentText(text) {
            if (!text) return '';
            let html = this.escapeHtml(text);

            // 1. 处理词条链接 - 新格式 [[entryId|versionId:displayText]]
            // 【修复】使用更精确的正则，避免末尾字符丢失
            html = html.replace(/\[\[([^\]|]+)\|([^:\]]+):([^\]]+)\]\]/g, (match, entryId, versionId, displayText) => {
                const cleanEntryId = entryId.trim();
                const cleanVersionId = versionId.trim();
                const cleanDisplayText = displayText.trim();
                const entry = this.findEntry(cleanEntryId);
                if (entry && entry.versions) {
                    const version = entry.versions.find(v => v.vid === cleanVersionId);
                    const actualVid = version ? version.vid : (entry.versions[0]?.vid || '');
                    return `<a href="javascript:void(0)" class="entry-index-link" data-entry-id="${entry.id}" data-version-id="${actualVid}" onclick="app.openEntryWithVersion('${entry.id}', '${actualVid}'); return false;">${cleanDisplayText}</a>`;
                }
                return `<span class="text-red-400" title="词条未找到">[[${cleanDisplayText}]]</span>`;
            });

            // 2. 处理词条链接 - 旧格式 [[entryIdOrCode:displayText]]
            html = html.replace(/\[\[([^\]|]+):([^\]]+)\]\]/g, (match, entryIdOrCode, displayText) => {
                const cleanId = entryIdOrCode.trim();
                const cleanDisplayText = displayText.trim();
                const entry = this.findEntry(cleanId);
                if (entry && entry.versions && entry.versions.length > 0) {
                    const firstVersion = entry.versions[0];
                    return `<a href="javascript:void(0)" class="entry-index-link" data-entry-id="${entry.id}" data-version-id="${firstVersion.vid}" onclick="app.openEntryWithVersion('${entry.id}', '${firstVersion.vid}'); return false;">${cleanDisplayText}</a>`;
                }
                return `<span class="text-red-400" title="词条未找到">[[${cleanDisplayText}]]</span>`;
            });

            // 3. 处理旧格式 [[title]]（通过标题查找）
            html = html.replace(/\[\[([^\]|]+)\]\]/g, (match, title) => {
                // 跳过已经处理过的链接（已被上面的正则替换）
                if (match.includes('|') || match.includes(':')) return match;
                const cleanTitle = title.trim();
                const entry = this.data.entries.find(e => {
                    const v = this.getVisibleVersion(e);
                    return v && v.title === cleanTitle;
                });
                if (entry && entry.versions.length > 0) {
                    const firstVersion = entry.versions[0];
                    return `<a href="javascript:void(0)" class="entry-index-link" data-entry-id="${entry.id}" data-version-id="${firstVersion.vid}" onclick="app.openEntryWithVersion('${entry.id}', '${firstVersion.vid}'); return false;">${cleanTitle}</a>`;
                }
                return `<span class="text-gray-400">[[${cleanTitle}]]</span>`;
            });

            // 4. 处理角色引用 @名字[代码]
            html = html.replace(/@([^\[]+)\[([^\]]+)\]/g, (match, name, code) => {
                const cleanName = name.trim();
                const cleanCode = code.replace(/\\/g, '').trim();
                const entry = this.data.entries.find(e => e.code === cleanCode);
                if (entry) {
                    return `<span class="synopsis-entry-ref" onclick="app.openEntry('${entry.id}')"><i class="fa-solid fa-user text-xs mr-1"></i>${cleanName}</span>`;
                }
                return `<span class="synopsis-entry-ref"><i class="fa-solid fa-user text-xs mr-1"></i>${cleanName}</span>`;
            });

            // 5. 处理剧情引用 {{synopsis:chapterId:title}}
            html = html.replace(/\{\{synopsis:([^:]+):([^}]+)\}\}/g, (match, chapterId, title) => {
                const cleanChapterId = chapterId.trim();
                const cleanTitle = title.trim();
                const chapter = this.data.synopsis.find(s => s.id === cleanChapterId);
                if (chapter) {
                    return `<span class="synopsis-entry-ref" data-chapter-id="${cleanChapterId}" onmouseenter="app.handleSynopsisRefHover(this)" onmouseleave="app.handleSynopsisRefLeave(this)" onclick="app.handleSynopsisRefClick(this)"><i class="fa-solid fa-film text-xs mr-1"></i>${cleanTitle}</span>`;
                }
                return match;
            });

            // 6. 处理 Markdown 样式标记
            html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
            html = html.replace(/\*(.+?)\*/g, '<i>$1</i>');
            html = html.replace(/__(.+?)__/g, '<u>$1</u>');
            html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');

            // 7. 处理内联图片 {{IMG:filename}}
            html = this._renderInlineImages(html);

            // 8. 换行符转为 <br>（EscapeHTML已经转义了换行符，需要恢复）
            html = html.replace(/\n/g, '<br>');

            return html;
        },

        // 行内Markdown解析（用于subtitle等短文本）
        parseInlineMarkdown(text) {
            if (!text) return '';
            let html = this.escapeHtml(text);
            html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
            html = html.replace(/\*(.+?)\*/g, '<i>$1</i>');
            html = html.replace(/__(.+?)__/g, '<u>$1</u>');
            html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');
            html = html.replace(/\n/g, '<br>');
            return html;
        },

        // ==================== 图片URL解析 ====================
        resolveImageUrl(imgRef) {
            if (!imgRef) return '';
            // dataUrl 直接返回
            if (imgRef.startsWith('data:')) return imgRef;
            // blob URL 直接返回（浏览器内存中可能有对应对象）
            if (imgRef.startsWith('blob:')) return imgRef;
            // http URL 直接返回
            if (imgRef.startsWith('http')) return imgRef;
            // {{IMG:filename}} 格式 → 转换为相对路径
            // 【关键修复】与详情页活动词条硬编码路径保持一致：./data/wiki-images/
            if (imgRef.startsWith('{{IMG:')) {
                const match = imgRef.match(/\{\{IMG:(.+?)\}\}/);
                if (match && match[1]) {
                    return `./data/wiki-images/${match[1]}`;
                }
            }
            return imgRef;
        },

        // 【隔离】剧情梗概图片专用 URL 解析函数（完全独立于 resolveImageUrl）
        // 回退至最初GitHub版本处理：优先从localStorage缓存恢复data URL
        // ==================== 辅助函数 ====================
        findEntry(idOrCode) {
            if (!idOrCode) return null;
            const cleanId = String(idOrCode).trim();
            let entry = this.data.entries.find(e => String(e.id).trim() === cleanId);
            if (!entry) entry = this.data.entries.find(e => e.code === cleanId);
            return entry;
        },

        escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        },

        // 【功能4】显示密码输入对话框（黑底白字风格，GitHub只读版）
        showPasswordDialog(hint, onSuccess, onCancel, errorMessage, entryName, entryId) {
            document.querySelectorAll('.pw-dialog-overlay').forEach(el => el.remove());
            const overlay = document.createElement('div');
            overlay.className = 'pw-dialog-overlay fixed inset-0 bg-black z-[9999] flex items-center justify-center p-4 fade-in';
            const errorHtml = errorMessage ? `<div class="text-red-400 text-sm mb-4 text-center animate-pulse"><i class="fa-solid fa-circle-exclamation mr-1"></i>${errorMessage}</div>` : '';
            const nameHtml = entryName ? `<div class="text-white font-bold text-lg mb-1">${app.escapeHtml(entryName)}</div>` : '';
            overlay.innerHTML = `
                <div class="w-full max-w-sm">
                    <div class="text-center mb-8">
                        <div class="w-14 h-14 rounded-full border-2 border-gray-600 flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-lock text-gray-400 text-xl"></i>
                        </div>
                        ${nameHtml}
                        <div class="text-gray-500 text-sm mb-1">该词条已锁定</div>
                        <div class="text-gray-400 text-xs">请根据要求输入口令</div>
                    </div>
                    ${hint ? `<div class="text-gray-300 text-sm mb-3 text-center"><i class="fa-solid fa-circle-question mr-1 text-gray-500"></i>${app.escapeHtml(hint)}</div>` : ''}
                    ${errorHtml}
                    <input type="text" id="pw-input" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-sm text-white mb-4 focus:ring-2 focus:ring-gray-500 focus:border-gray-500 outline-none placeholder-gray-600" placeholder="输入口令..." autocomplete="off">
                    <div class="flex gap-3">
                        <button id="pw-cancel" class="flex-1 py-2.5 border border-gray-700 text-gray-400 rounded-lg hover:bg-gray-900 hover:text-gray-200 transition text-sm">返回</button>
                        <button id="pw-submit" class="flex-1 py-2.5 bg-gray-100 text-black rounded-lg hover:bg-white transition text-sm font-medium">确认</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            const input = overlay.querySelector('#pw-input');
            input.focus();
            const submit = () => {
                const val = input.value.trim();
                if (!val) {
                    const existingError = overlay.querySelector('.pw-empty-error');
                    if (!existingError) {
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'pw-empty-error text-red-400 text-sm mb-4 text-center animate-pulse';
                        errorDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i>请输入口令后再确认';
                        input.parentNode.insertBefore(errorDiv, input);
                    }
                    input.focus();
                    return;
                }
                overlay.remove();
                onSuccess(val);
            };
            overlay.querySelector('#pw-submit').onclick = submit;
            input.onkeydown = (e) => {
                if (e.key !== 'Enter') {
                    const emptyError = overlay.querySelector('.pw-empty-error');
                    if (emptyError) emptyError.remove();
                }
                if (e.key === 'Enter') submit();
            };
            overlay.querySelector('#pw-cancel').onclick = () => { overlay.remove(); onCancel && onCancel(); };
            overlay.onclick = (e) => { if (e.target === overlay) {} };
        },

        stripHtml(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        },

        formatChapterNum(num) {
            if (num === undefined || num === null) return '';
            return String(num);
        },

        getChapterOrder(chapterId) {
            if (!chapterId) return -1;
            const chapter = this.data.chapters.find(c => c.id === chapterId);
            return chapter ? chapter.order : -1;
        },

        getVisibleVersion(entry) {
            if (!entry || !entry.versions || entry.versions.length === 0) return null;
            if (this.data.currentTimeline === 'latest') {
                if (entry.defaultPinnedVersion) {
                    const pinned = entry.versions.find(v => v.vid === entry.defaultPinnedVersion);
                    if (pinned) return pinned;
                }
                return entry.versions[entry.versions.length - 1];
            }
            const currentCh = this.data.chapters.find(c => c.id === this.data.currentTimeline);
            if (!currentCh) return entry.versions[entry.versions.length - 1];

            // 【修复】检查置顶版本：pinnedVersions 的键是区间起始章节ID
            // 需要遍历查找当前章节所在的区间范围
            if (entry.pinnedVersions) {
                for (const [startChId, vid] of Object.entries(entry.pinnedVersions)) {
                    const startCh = this.data.chapters.find(c => c.id === startChId);
                    if (!startCh) continue;
                    // 找到该区间的结束点（下一个有置顶设置的区间起始，或章节末尾）
                    let endOrder = Infinity;
                    for (const otherStartId of Object.keys(entry.pinnedVersions)) {
                        if (otherStartId === startChId) continue;
                        const otherCh = this.data.chapters.find(c => c.id === otherStartId);
                        if (otherCh && otherCh.order > startCh.order && otherCh.order < endOrder) {
                            endOrder = otherCh.order;
                        }
                    }
                    // 当前章节是否在此区间内
                    if (currentCh.order >= startCh.order && currentCh.order < endOrder) {
                        const pinned = entry.versions.find(v => v.vid === vid);
                        if (pinned) return pinned;
                    }
                }
            }

            // 查找当前时间轴下最新版本
            let activeVersion = null;
            for (let i = entry.versions.length - 1; i >= 0; i--) {
                const v = entry.versions[i];
                const fromOrder = this.getChapterOrder(v.chapterFrom);
                const toOrder = v.chapterTo ? this.getChapterOrder(v.chapterTo) : Infinity;
                if (currentCh.order >= fromOrder && currentCh.order <= toOrder) {
                    activeVersion = v;
                    break;
                }
            }

            // 如果没找到活跃版本，检查是否有默认置顶版本（失踪区间）
            if (!activeVersion && entry.missingIntervalVersion) {
                return entry.versions.find(v => v.vid === entry.missingIntervalVersion) || entry.versions[entry.versions.length - 1];
            }
            if (!activeVersion && entry.defaultPinnedVersion) {
                return entry.versions.find(v => v.vid === entry.defaultPinnedVersion) || entry.versions[entry.versions.length - 1];
            }
            return activeVersion || entry.versions[entry.versions.length - 1];
        },

        getVersionTimeStatus(entry, version) {
            if (this.data.currentTimeline === 'latest') return 'current';
            const currentCh = this.data.chapters.find(c => c.id === this.data.currentTimeline);
            if (!currentCh) return 'current';
            const fromCh = version.chapterFrom ? this.data.chapters.find(c => c.id === version.chapterFrom) : null;
            const toCh = version.chapterTo ? this.data.chapters.find(c => c.id === version.chapterTo) : null;
            const fromOrder = fromCh ? fromCh.order : -1;
            const toOrder = toCh ? toCh.order : Infinity;
            if (currentCh.order >= fromOrder && currentCh.order <= toOrder) return 'current';
            if (currentCh.order > toOrder) return 'past';
            return 'future';
        },

        getCharacterDisplayStatus(entry) {
            if (!entry || entry.type !== 'character') return 'normal';
            const currentVersion = this.getVisibleVersion(entry);
            if (!currentVersion) return 'missing';
            const timeStatus = this.getVersionTimeStatus(entry, currentVersion);
            if (timeStatus === 'future') return 'future';
            if (timeStatus === 'current' || timeStatus === 'past') {
                const isMissing = this.checkIfMissing(entry);
                if (isMissing) return 'missing';
            }
            const hasParallel = this.checkHasParallelVersions(entry);
            if (hasParallel) return 'parallel';
            return 'normal';
        },

        checkIfMissing(entry) {
            if (!entry || !entry.versions || entry.versions.length === 0) return false;
            const currentCh = this.data.currentTimeline === 'latest' ? { order: Infinity } : this.data.chapters.find(c => c.id === this.data.currentTimeline);
            if (!currentCh || currentCh.order === Infinity) return false;
            const currentVersion = this.getVisibleVersion(entry);
            if (!currentVersion) return false;
            if (!currentVersion.chapterTo) return false;
            const currentToOrder = this.getChapterOrder(currentVersion.chapterTo);
            if (currentCh.order < currentToOrder) return false;
            const hasFutureVersion = entry.versions.some(v => {
                if (v.vid === currentVersion.vid) return false;
                const vFromOrder = this.getChapterOrder(v.chapterFrom);
                return vFromOrder > currentToOrder;
            });
            if (hasFutureVersion) return false;
            return true;
        },

        isCharacterPinned(entry) {
            if (!entry || !entry.pinned) return false;
            if (!entry.pinStartChapter && !entry.pinEndChapter) return true;
            const currentCh = this.data.currentTimeline === 'latest' ? null : this.data.chapters.find(c => c.id === this.data.currentTimeline);
            if (!currentCh) return true;
            const startOrder = entry.pinStartChapter ? this.getChapterOrder(entry.pinStartChapter) : -1;
            const endOrder = entry.pinEndChapter ? this.getChapterOrder(entry.pinEndChapter) : Infinity;
            return currentCh.order >= startOrder && currentCh.order <= endOrder;
        },

        checkHasParallelVersions(entry) {
            if (!entry || !entry.versions || entry.versions.length < 2) return false;
            if (this.data.currentTimeline === 'latest') return false;
            const currentCh = this.data.chapters.find(c => c.id === this.data.currentTimeline);
            if (!currentCh) return false;
            let activeCount = 0;
            for (const v of entry.versions) {
                const fromOrder = this.getChapterOrder(v.chapterFrom);
                const toOrder = this.getChapterOrder(v.chapterTo);
                if (currentCh.order >= fromOrder && currentCh.order <= toOrder) {
                    activeCount++;
                    if (activeCount >= 2) return true;
                }
            }
            return false;
        },

        getSortLevel(entry, status) {
            if (status === 'future') return entry.versions?.[0]?.level || 5;
            const version = this.getVisibleVersion(entry);
            return version?.level || entry?.level || 5;
        },

        getSettingTimeStatus(entry, version) {
            if (!version) return 'current';
            if (this.data.currentTimeline === 'latest') return 'current';
            const currentCh = this.data.chapters.find(c => c.id === this.data.currentTimeline);
            if (!currentCh) return 'current';
            const fromCh = version.chapterFrom ? this.data.chapters.find(c => c.id === version.chapterFrom) : null;
            const toCh = version.chapterTo ? this.data.chapters.find(c => c.id === version.chapterTo) : null;
            const fromOrder = fromCh ? fromCh.order : -1;
            const toOrder = toCh ? toCh.order : Infinity;
            if (currentCh.order >= fromOrder && currentCh.order <= toOrder) return 'current';
            if (currentCh.order > toOrder) return 'past';
            return 'future';
        },

        getSettingTypeLabel(type) {
            const labels = { 'world': '世界设定', 'document': '特殊文献', 'art': '绘画/图片', 'faction': '阵营', 'custom': '自定义' };
            return labels[type] || '其他';
        },

        getSettingTypeIcon(type) {
            const icons = { 'world': 'fa-globe', 'document': 'fa-scroll', 'art': 'fa-palette', 'faction': 'fa-shield-halved', 'custom': 'fa-folder' };
            return icons[type] || 'fa-folder';
        },

        getMissingInfo(entry) {
            const currentVersion = this.getVisibleVersion(entry);
            if (!currentVersion) return null;
            const futureVersions = entry.versions.filter(v => {
                const vFromOrder = this.getChapterOrder(v.chapterFrom);
                const currentFromOrder = this.getChapterOrder(currentVersion.chapterFrom);
                return vFromOrder > currentFromOrder;
            }).sort((a, b) => this.getChapterOrder(a.chapterFrom) - this.getChapterOrder(b.chapterFrom));
            return { isMissing: true, latestVersion: futureVersions.length > 0 ? futureVersions[futureVersions.length - 1] : currentVersion, currentVersion, missingSince: currentVersion.chapterTo ? this.data.chapters.find(c => c.id === currentVersion.chapterTo) : null };
        },

        // ==================== 搜索 ====================
        handleSearchInput(value) {
            const dropdown = document.getElementById('search-dropdown');
            if (!value.trim()) { dropdown.classList.add('hidden'); return; }
            const results = this.data.entries.filter(e => {
                const v = this.getVisibleVersion(e);
                const title = v ? v.title : '';
                return e.code.toLowerCase().includes(value.toLowerCase()) || title.toLowerCase().includes(value.toLowerCase());
            }).slice(0, 10);
            if (results.length === 0) { dropdown.innerHTML = '<div class="p-4 text-sm text-gray-500 text-center">无结果</div>'; dropdown.classList.remove('hidden'); return; }
            dropdown.innerHTML = results.map(e => {
                const v = this.getVisibleVersion(e);
                const status = this.getCharacterDisplayStatus(e);
                const statusTag = status === 'future' ? '<span class="search-tag future">未来</span>' : status === 'missing' ? '<span class="search-tag past">失踪</span>' : '<span class="search-tag current">当前</span>';
                return `<div class="search-item" onclick="app.openEntry('${e.id}'); app.hideSearchDropdown();">
                    <span class="text-xs font-mono bg-gray-100 px-2 py-0.5 rounded">${e.code}</span>
                    <span class="text-sm text-gray-700">${this.escapeHtml(v?.title || '')}</span>
                    ${statusTag}
                </div>`;
            }).join('');
            dropdown.classList.remove('hidden');
        },

        showSearchDropdown() { if (document.getElementById('global-search').value.trim()) document.getElementById('search-dropdown').classList.remove('hidden'); },
        hideSearchDropdown() { document.getElementById('search-dropdown').classList.add('hidden'); },

        // ==================== 导航 ====================
        openEntry(entryId, versionId) {
            const entry = this.data.entries.find(e => e.id === entryId);
            if (!entry) return;

            // 【功能4】检查隐藏目录密码（GitHub只读版，每个词条独立）
            const hiddenCfg = this.data.settings?.hiddenCategory;
            const isHidden = hiddenCfg?.entries?.includes(entry.id);
            this.data._currentHiddenEntryId = isHidden ? entry.id : null;
            if (isHidden) {
                const pwCfg = hiddenCfg?.entryPasswords?.[entry.id];
                if (pwCfg && pwCfg.answers && pwCfg.answers.length > 0) {
                    const pwKey = 'hidden_pw_' + entry.id;
                    const canSkip = pwCfg.alwaysRequired === false && sessionStorage.getItem(pwKey) === 'ok';
                    if (!canSkip && this._pwCheckingEntryId !== entry.id) {
                        if (app.showPasswordDialog) {
                            this._pwCheckingEntryId = entry.id;
                            const visibleVersion = this.getVisibleVersion(entry);
                            const entryName = visibleVersion ? visibleVersion.title : entry.code;
                            const returnView = this.data.currentView;
                            const tryPassword = (answer) => {
                                if (!answer || answer.trim() === '') {
                                    app.showPasswordDialog(pwCfg.hint || '请输入密码', tryPassword, () => {
                                        this._pwCheckingEntryId = null;
                                        this._returnFromPasswordLock(returnView, entry);
                                    }, '请输入口令后再确认', entryName, entry.id);
                                    return;
                                }
                                const isCorrect = pwCfg.answers.some(a => a.trim() === answer.trim());
                                if (isCorrect) {
                                    sessionStorage.setItem(pwKey, 'ok');
                                    this._pwCheckingEntryId = null;
                                    this._clearPasswordLock();
                                    this._openEntryInternal(entryId, versionId);
                                } else {
                                    let errorMsg = pwCfg.defaultMessage || '不对啦！';
                                    if (pwCfg.rules) {
                                        for (const rule of pwCfg.rules) {
                                            if (rule.condition === 'equals' && answer.trim() === rule.answer) { errorMsg = rule.message; break; }
                                            else if (rule.condition === 'includes' && answer.includes(rule.answer)) { errorMsg = rule.message; break; }
                                        }
                                    }
                                    app.showPasswordDialog(pwCfg.hint || '请输入密码', tryPassword, () => {
                                        this._pwCheckingEntryId = null;
                                        this._returnFromPasswordLock(returnView, entry);
                                    }, errorMsg, entryName, entry.id);
                                }
                            };
                            this._showPasswordLock(entryName);
                            app.showPasswordDialog(pwCfg.hint || '请输入密码', tryPassword, () => {
                                this._pwCheckingEntryId = null;
                                this._returnFromPasswordLock(returnView, entry);
                            }, null, entryName, entry.id);
                            return;
                        }
                    }
                }
            } else {
                this._pwCheckingEntryId = null;
            }
            this._openEntryInternal(entryId, versionId);
        },

        // 【功能4】openEntry 的内部逻辑（提取出来供密码检查通过后调用）
        _openEntryInternal(entryId, versionId) {
            const entry = this.data.entries.find(e => e.id === entryId);
            if (!entry) return;
            // 【回到xx】记录来源词条（进入新词条前记录当前词条）
            this._recordPreviousEntry();
            this.data.editingId = entryId;
            if (versionId && entry.versions.some(v => v.vid === versionId)) {
                this.data.viewingVersionId = versionId;
            } else {
                this.data.viewingVersionId = null;
            }
            this.addToHistory(entry);
            this.router('detail');
        },

        openEntryWithVersion(entryId, versionId) {
            this.openEntry(entryId, versionId);
        },

        // ==================== 隐藏词条密码保护（GitHub只读版） ====================
        _showPasswordLock(entryName) {
            this._clearPasswordLock();
            const lock = document.createElement('div');
            lock.id = 'password-lock-overlay';
            lock.className = 'fixed inset-0 bg-black z-[9998] flex flex-col items-center justify-center text-white';
            lock.innerHTML = `
                <div class="text-center">
                    <div class="text-6xl mb-6"><i class="fa-solid fa-lock text-gray-600"></i></div>
                    <div class="text-xl font-bold text-gray-300 mb-2">${app.escapeHtml(entryName)}</div>
                    <div class="text-sm text-gray-500">该内容已被锁定</div>
                </div>
            `;
            document.body.appendChild(lock);
        },

        _clearPasswordLock() {
            const lock = document.getElementById('password-lock-overlay');
            if (lock) lock.remove();
        },

        _returnFromPasswordLock(returnView, entry) {
            this._clearPasswordLock();
            this.data._currentHiddenEntryId = null;
            if (returnView && returnView !== 'detail') {
                this.router(returnView);
            } else {
                this.router(entry?.type === 'non-character' ? 'non-characters' : 'characters');
            }
        },

        goBackFromDetail() {
            // 【回到xx】返回列表页时清空记录
            this._clearPreviousEntry();
            const entry = this.data.entries.find(e => e.id === this.data.editingId);
            // 根据词条类型返回对应页面：角色→角色页，设定→设定页，正文→剧情梗概
            if (entry && entry.type === 'body') {
                this.router('synopsis');
            } else if (entry && entry.type === 'non-character') {
                this.router('non-characters');
            } else if (entry && entry.type === 'character') {
                this.router('characters');
            } else {
                this.router('home');
            }
        },

        addToHistory(entry) {
            if (!this.data.history) this.data.history = [];
            this.data.history = this.data.history.filter(h => h.id !== entry.id);
            this.data.history.push({ id: entry.id, timestamp: Date.now() });
            if (this.data.history.length > 50) this.data.history = this.data.history.slice(-50);
        },

        // ==================== 时间轴 ====================
        setTimeline(chapterId) {
            this.data.currentTimeline = chapterId;
            const toast = document.getElementById('timeline-switch-toast');
            const toastText = document.getElementById('timeline-switch-text');
            if (chapterId === 'latest') {
                if (toastText) toastText.textContent = '已切换到最新进度';
            } else {
                const ch = this.data.chapters.find(c => c.id === chapterId);
                if (toastText && ch) toastText.textContent = `已切换到 ${this.formatChapterNum(ch.num)} ${ch.title || ''}`;
            }
            if (toast) { toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
            // 刷新当前视图
            const currentView = this.data.currentView;
            if (currentView === 'characters' || currentView === 'non-characters' || currentView === 'detail' || currentView === 'graph') {
                this.router(currentView, true);
            }
        },

        // ==================== 公告 ====================
        viewAnnouncement() {
            const ann = this.data.announcements?.find(a => a.isActive);
            if (!ann) { this.showToast('当前没有生效的公告', 'info'); return; }
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-black/60 z-[99999] flex items-center justify-center p-4 fade-in';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col overflow-hidden">
                    <div class="p-4 border-b bg-gradient-to-r from-orange-50 to-amber-50 flex justify-between items-center">
                        <div><h3 class="font-bold text-lg text-gray-800">${this.escapeHtml(ann.title || '公告')}</h3><p class="text-xs text-gray-500">${this.escapeHtml(ann.author || '匿名')} · ${ann.date || ''}</p></div>
                        <button onclick="this.closest('.fixed').remove()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-times"></i></button>

                </div>`;

        // ==================== Toast ====================
        showToast(message, type = 'info', duration = 3000) {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 left-1/2 transform -translate-x-1/2 z-[99999] px-4 py-2 rounded-lg shadow-lg text-white text-sm flex items-center gap-2 fade-in ${type === 'success' ? 'bg-green-600' : type === 'warning' ? 'bg-amber-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'}`;
            const icons = { info: 'fa-circle-info', success: 'fa-check-circle', warning: 'fa-triangle-exclamation', error: 'fa-circle-exclamation' };
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, duration);
        },

        // ==================== 关系图谱 ====================
        renderGraph(container) {
            if (this.isDataEmpty()) {
                this.showEmptyState(container, '暂无角色数据', '管理员尚未添加角色，关系图无法显示。');
                return;
            }
            const tpl = document.getElementById('tpl-graph');
            if (!tpl) return;
            const clone = tpl.content.cloneNode(true);
            container.appendChild(clone);
            this.initDraggablePanel();
            this.initGraphPan();
            setTimeout(() => this.renderGraphNodes(), 50);
        },

        initDraggablePanel() {
            const panel = document.getElementById('graph-info-panel');
            if (!panel) return;
            const handle = panel.querySelector('.draggable-handle');
            if (!handle) return;
            let isDragging = false, startX, startY, initialX, initialY;
            handle.addEventListener('mousedown', (e) => { isDragging = true; panel.classList.add('dragging'); startX = e.clientX; startY = e.clientY; const rect = panel.getBoundingClientRect(); initialX = rect.left; initialY = rect.top; e.preventDefault(); });
            document.addEventListener('mousemove', (e) => { if (!isDragging) return; const dx = e.clientX - startX; const dy = e.clientY - startY; panel.style.left = `${initialX + dx}px`; panel.style.top = `${initialY + dy}px`; panel.style.right = 'auto'; });
            document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; panel.classList.remove('dragging'); } });
        },

        // 【修复】从本地版同步：添加图谱画布拖拽/平移功能
        initGraphPan() {
            const container = document.getElementById('graph-container');
            if (!container) return;
            let isMouseDown = false;
            let isPanning = false;
            let startX, startY, downX, downY;
            const PAN_THRESHOLD = 3;

            container.addEventListener('mousedown', (e) => {
                // 排除 info-panel、工具栏、导航栏
                if (e.target.closest('#graph-info-panel')) return;
                if (e.target.closest('nav') || e.target.closest('header')) return;
                isMouseDown = true;
                isPanning = false;
                downX = e.clientX;
                downY = e.clientY;
                startX = e.clientX - (this.data.graphState.translateX || 0);
                startY = e.clientY - (this.data.graphState.translateY || 0);
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                if (!isPanning) {
                    const dx = Math.abs(e.clientX - downX);
                    const dy = Math.abs(e.clientY - downY);
                    if (dx > PAN_THRESHOLD || dy > PAN_THRESHOLD) {
                        isPanning = true;
                        container.style.cursor = 'grabbing';
                    } else { return; }
                }
                this.data.graphState.translateX = e.clientX - startX;
                this.data.graphState.translateY = e.clientY - startY;
                this.applyGraphTransform();
            });
            document.addEventListener('mouseup', (e) => {
                if (!isMouseDown) return;
                isMouseDown = false;
                if (isPanning) {
                    isPanning = false;
                    container.style.cursor = 'grab';
                    // 阻止拖拽产生的 click 误触发节点选中
                    const suppressClick = (ce) => {
                        if (ce.target.closest('#graph-container')) {
                            ce.stopPropagation();
                        }
                        document.removeEventListener('click', suppressClick, true);
                    };
                    setTimeout(() => document.addEventListener('click', suppressClick, true), 0);
                }
            });
            // Touch support
            let isTouchPanning = false;
            let touchStartX, touchStartY;
            container.addEventListener('touchstart', (e) => {
                if (e.target.closest('#graph-info-panel')) return;
                if (e.target.closest('nav') || e.target.closest('header')) return;
                if (e.touches.length !== 1) return;
                isTouchPanning = true;
                touchStartX = e.touches[0].clientX - (this.data.graphState.translateX || 0);
                touchStartY = e.touches[0].clientY - (this.data.graphState.translateY || 0);
            }, { passive: true });
            // 【修复】容器级别 touchmove 使用 passive:false，阻止页面滚动
            container.addEventListener('touchmove', (e) => {
                if (!isTouchPanning) return;
                if (e.touches.length !== 1) { isTouchPanning = false; return; }
                e.preventDefault();
                this.data.graphState.translateX = e.touches[0].clientX - touchStartX;
                this.data.graphState.translateY = e.touches[0].clientY - touchStartY;
                this.applyGraphTransform();
            }, { passive: false });
            container.addEventListener('touchend', () => { isTouchPanning = false; });
            container.addEventListener('touchcancel', () => { isTouchPanning = false; });
        },

        togglePanelCollapse() {
            const content = document.getElementById('panel-content');
            const icon = document.querySelector('#graph-info-panel button i');
            if (!content || !icon) return;
            if (content.classList.contains('hidden')) { content.classList.remove('hidden'); icon.className = 'fa-solid fa-minus'; }
            else { content.classList.add('hidden'); icon.className = 'fa-solid fa-plus'; }
        },

        renderGraphNodes() {
            const container = document.getElementById('graph-nodes');
            const svg = document.getElementById('graph-svg');
            if (!container || !svg) return;
            container.innerHTML = '';
            svg.innerHTML = '';
            let chars = this.data.entries.filter(e => e.type === 'character');
            if (this.data.currentTimeline !== 'latest') chars = chars.filter(e => this.getVisibleVersion(e) !== null);
            if (chars.length === 0) { container.innerHTML = '<div class="text-center text-gray-400 mt-20">暂无角色数据</div>'; return; }

            const hexRadius = 80, hexWidth = hexRadius * Math.sqrt(3), hexHeight = hexRadius * 2;
            const containerRect = container.getBoundingClientRect();
            const centerX = containerRect.width / 2, centerY = containerRect.height / 2;
            const positions = this.calculateHoneycombPositions(chars.length, hexWidth, hexHeight, centerX, centerY);

            chars.forEach((char, idx) => {
                const version = this.getVisibleVersion(char);
                if (!version) return;
                const pos = positions[idx];
                const node = document.createElement('div');
                node.className = 'hexagon-wrapper absolute';
                node.style.left = `${pos.x - 70}px`; node.style.top = `${pos.y - 80}px`;
                node.style.width = '140px'; node.style.height = '160px';
                node.dataset.charId = char.id;

                let avatarImg = version.images?.avatar || version.image;
                avatarImg = this.resolveImageUrl(avatarImg);

                node.innerHTML = `
                    <div class="hexagon lvl-${version.level || char.level || 3}">
                        <div class="hexagon-content">
                            <div class="w-16 h-16 rounded-full bg-gray-200 overflow-hidden mb-2 border-2 border-white shadow">
                                ${avatarImg ? `<img src="${avatarImg}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'w-full h-full bg-indigo-100 flex items-center justify-center text-indigo-500 text-xs font-bold\\'>${char.code}</div>'">` : `<div class="w-full h-full bg-indigo-100 flex items-center justify-center text-indigo-500 text-xs font-bold">${char.code}</div>`}
                            </div>
                            <div class="text-xs font-bold text-center truncate w-full px-2">${this.escapeHtml(version.title)}</div>
                            ${(version.level === 1 || char.level === 1) ? '<div class="absolute -top-1 -right-1 w-6 h-6 bg-yellow-500 rounded-full flex items-center justify-center text-white text-[10px] shadow"><i class="fa-solid fa-star"></i></div>' : ''}
                        </div>
                    </div>`;

                let clickTimer = null, clickCount = 0;
                node.onclick = (e) => {
                    e.stopPropagation();
                    clickCount++;
                    if (clickCount === 1) { this.selectGraphNode(char); clickTimer = setTimeout(() => { clickCount = 0; }, 300); }
                    else if (clickCount === 2) { clearTimeout(clickTimer); clickCount = 0; this.openEntry(char.id); }
                };
                container.appendChild(node);
            });
            this.drawRelationLines(chars, positions);
            const graphContainer = document.getElementById('graph-container');
            if (graphContainer) graphContainer.onclick = (e) => { if (e.target.id === 'graph-container' || e.target.id === 'graph-svg') this.resetGraphSelection(); };
        },

        calculateHoneycombPositions(count, hexW, hexH, centerX, centerY) {
            const positions = [{ x: centerX, y: centerY }];
            if (count <= 1) return positions;
            let ring = 1, remaining = count - 1;
            while (remaining > 0) {
                const ringCount = ring * 6;
                for (let i = 0; i < Math.min(ringCount, remaining); i++) {
                    const angle = (i / ringCount) * Math.PI * 2 - Math.PI / 2;
                    const radius = ring * hexW;
                    positions.push({ x: centerX + Math.cos(angle) * radius, y: centerY + Math.sin(angle) * radius * 0.866 });
                }
                remaining -= ringCount; ring++;
            }
            return positions;
        },

        drawRelationLines(chars, positions) {
            const svg = document.getElementById('graph-svg');
            if (!svg) return;
            chars.forEach((char, idx) => {
                const version = this.getVisibleVersion(char);
                if (!version || !version.relatedCharacters) return;
                const startPos = positions[idx];
                version.relatedCharacters.forEach(rc => {
                    const targetIdx = chars.findIndex(c => c.id === rc.charId);
                    if (targetIdx === -1) return;
                    const endPos = positions[targetIdx];
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', startPos.x); line.setAttribute('y1', startPos.y);
                    line.setAttribute('x2', endPos.x); line.setAttribute('y2', endPos.y);
                    line.setAttribute('stroke', '#cbd5e1'); line.setAttribute('stroke-width', '2'); line.setAttribute('stroke-dasharray', '5,5');
                    svg.appendChild(line);
                });
            });
        },

        selectGraphNode(char) {
            const version = this.getVisibleVersion(char);
            if (!version) return;
            const infoDiv = document.getElementById('selected-character-info');
            const emptyHint = document.getElementById('graph-empty-hint');
            if (emptyHint) emptyHint.classList.add('hidden');

        // ========== 词条分享与导出 ==========
        shareCurrentEntry() {

            if (!entry) { this.showToast('未找到当前词条', 'error'); return; }
